<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Petras Group — Εκτύπωση</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;font-size:11px;color:#111827;background:#fff;line-height:1.5}
#loading{display:flex;align-items:center;justify-content:center;height:90vh;
  font-size:13px;color:#6B7280;gap:10px;font-family:'DM Sans',sans-serif}
.spin{width:18px;height:18px;border:2px solid #E5E7EB;border-top-color:#0B1929;
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── PRINT BAR (screen only) ── */
.pbar{position:fixed;top:0;left:0;right:0;z-index:99;
  background:#0B1929;padding:10px 24px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:2px solid #172C45}
.pbar-left{display:flex;align-items:center;gap:14px}
.pbar-logo{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;
  letter-spacing:0.5px;color:#fff}
.pbar-logo span{color:#8B95A1}
.pbar-div{width:1px;height:16px;background:rgba(255,255,255,0.15)}
.pbar-title{font-size:11px;color:rgba(196,207,219,0.7);letter-spacing:0.3px}
.pbar-btn{background:#6B7280;color:#fff;border:none;padding:7px 20px;
  border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;
  font-family:'DM Sans',sans-serif;letter-spacing:0.4px;transition:background .12s}
.pbar-btn:hover{background:#4B5563}
.pbar-spacer{height:46px}

/* ── DOC WRAPPER ── */
#doc{display:none;padding:36px 44px;max-width:900px;margin:0 auto}

/* ── HEADER ── */
.doc-header{display:flex;justify-content:space-between;align-items:flex-start;
  padding-bottom:18px;margin-bottom:20px;
  border-bottom:3px solid #0B1929}
.carrier-label{font-size:8px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;color:#9CA3AF;margin-bottom:4px}
.carrier-name{font-size:15px;font-weight:700;color:#0B1929}
.carrier-sub{font-size:10.5px;color:#4B5563;line-height:1.7;margin-top:2px}
.plates-tag{display:inline-block;background:#0B1929;color:#fff;font-weight:700;
  font-size:12px;padding:3px 12px;border-radius:3px;margin-top:6px;letter-spacing:1px}
.brand-wrap{text-align:right}
.brand{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;
  color:#0B1929;letter-spacing:0.5px}
.brand span{color:#8B95A1}
.brand-sub{font-size:7.5px;color:#9CA3AF;letter-spacing:2px;text-transform:uppercase;margin-top:1px}
.co-info{margin-top:6px;font-size:10.5px;color:#4B5563;line-height:1.7;text-align:right}
.co-info b{color:#0B1929;font-weight:600}

/* ── DRIVER BLOCK (owned fleet) ── */
.driver-block{background:#0B1929;border-radius:6px;padding:12px 18px;margin-bottom:18px}
.driver-block-row{display:flex;gap:32px;align-items:center}
.db-item .lbl{font-size:8px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;color:rgba(196,207,219,0.55);margin-bottom:2px}
.db-item .val{font-size:13px;font-weight:700;color:#fff;letter-spacing:0.3px}

/* ── DOC TITLE ── */
.doc-title{text-align:center;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;
  padding:9px 0;margin:0 0 16px;
  border-top:2px solid #0B1929;border-bottom:2px solid #0B1929;
  letter-spacing:1.2px;text-transform:uppercase;color:#0B1929}

/* ── META GRID ── */
.meta{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:16px;
  border:1px solid #E5E7EB;border-radius:6px;overflow:hidden}
.meta-item{padding:7px 14px;border-bottom:1px solid #F3F4F6;
  display:flex;gap:10px;align-items:center}
.meta-item:nth-child(odd){border-right:1px solid #F3F4F6}
.meta-item:last-child,.meta-item:nth-last-child(2){border-bottom:none}
.meta-lbl{font-size:9px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:#9CA3AF;min-width:72px;flex-shrink:0}
.meta-val{font-size:11px;font-weight:600;color:#111827}

/* ── PRICE BAR ── */
.price-bar{display:flex;justify-content:space-between;align-items:center;
  background:#F8FAFC;border:1.5px solid #8B95A1;border-radius:6px;
  padding:12px 20px;margin-bottom:20px}
.price-amount{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#0F172A}
.price-lbl{font-size:8.5px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:#9CA3AF;margin-bottom:3px}
.price-terms{text-align:right}
.price-terms .val{font-size:12px;font-weight:700;color:#0B1929}

/* ── SECTION TITLE (navy accent — matches app palette) ── */
.section-title{font-size:9px;font-weight:800;text-transform:uppercase;
  letter-spacing:1.8px;color:#0B1929;background:transparent;
  padding:4px 0 4px 10px;margin:16px 0 6px;
  border-left:3px solid #0B1929}
.section-title.load-section{border-left-color:#0B1929;color:#0B1929}
.section-title.unload-section{border-left-color:#8B95A1;color:#475569}

/* ── STOP CARD (navy/silver tones — matches app) ── */
.stop-card{border:1px solid #E5E7EB;border-left:4px solid #0B1929;border-radius:6px;padding:12px 16px;
  margin-bottom:8px;background:#FAFAFA;position:relative}
.stop-card.load{border-left-color:#0B1929}
.stop-card.unload{border-left-color:#8B95A1}
.stop-card.crossdock{border-left-color:#0284C7}
.stop-name{font-size:14px;font-weight:700;color:#0B1929;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.stop-badge{font-size:8px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;
  padding:1px 6px;border-radius:3px;color:#fff}
.stop-badge.load{background:#0B1929}
.stop-badge.unload{background:#475569}
.stop-badge.crossdock{background:#0284C7}
.stop-addr{font-size:10.5px;color:#6B7280;margin-bottom:6px}
.stop-map{font-size:10px;color:#0284C7;text-decoration:none;display:inline-block;margin-bottom:6px}
.stop-map:hover{text-decoration:underline}
.stop-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 24px}
.stop-field{display:flex;gap:8px;padding:2px 0;font-size:13px}
.stop-field b{color:#374151;min-width:116px;font-weight:600;flex-shrink:0}
.stop-field span{color:#111827}
/* Temperature — subtle navy tone emphasis, no clashing colors */
.temp-cold{color:#0B1929;font-weight:700}
.temp-frozen{color:#0B1929;font-weight:700;letter-spacing:0.3px}
.temp-chilled{color:#0284C7;font-weight:700}

/* ── BADGE ── */
.badge{display:inline-block;font-size:8px;font-weight:800;letter-spacing:0.8px;
  text-transform:uppercase;padding:2px 7px;border-radius:3px;
  color:#fff;margin-left:6px;vertical-align:middle}
.b-risk   {background:#DC2626}
.b-pe     {background:#059669}
.b-grp    {background:#0EA5E9}
.b-veroia {background:#0B1929}

/* ── NOTES ── */
.notes-box{margin:12px 0;padding:12px 18px;border:1px solid #E5E7EB;
  border-left:4px solid #8B95A1;border-radius:6px;background:#FAFAFA;font-size:11px;color:#374151}
.notes-box b{color:#0B1929}
.notes-box.urgent{border-left:4px solid #0B1929;background:#F8FAFC}
.notes-box.urgent b{color:#0B1929;text-transform:uppercase;letter-spacing:1px;font-size:10px}

/* ── SIGNATURE (larger, clearer) ── */
.sig-table{width:100%;border-collapse:collapse;margin-top:24px}
.sig-table td{width:50%;padding:14px 18px;border:1px solid #0B1929;vertical-align:top}
.sig-name{font-weight:700;font-size:12px;color:#0B1929;margin-bottom:2px}
.sig-role{font-size:8.5px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:#9CA3AF;margin-bottom:44px}
.sig-line{border-top:1px solid #D1D5DB;padding-top:5px;
  font-size:9px;color:#9CA3AF;text-align:center}

/* ── ROUTE STRIP (redesign 9/8 — «Claude design» pass) ── */
.route-strip{display:flex;align-items:center;gap:16px;background:#F1F5F9;border:1px solid #CBD5E1;
  border-radius:8px;padding:12px 18px;margin-bottom:16px}
.rs-side{flex:1;min-width:0}
.rs-lbl{font-size:7.5px;font-weight:800;letter-spacing:1.6px;color:#64748B;text-transform:uppercase;margin-bottom:2px}
.rs-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:#0B1929;line-height:1.25}
.rs-date{font-size:10.5px;color:#0284C7;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.rs-arrow{font-size:20px;color:#0284C7;flex-shrink:0;font-weight:700}
.stop-n{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#0284C7;color:#fff;
  font-size:10px;font-weight:800;align-items:center;justify-content:center;flex-shrink:0}
.stop-n.load{background:#0B1929}.stop-n.unload{background:#475569}.stop-n.crossdock{background:#0284C7}
.stop-title{min-width:0}
.pal-n{font-size:13px;font-weight:800;color:#0B1929}
body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:A4;margin:9mm}
@media print{
  .pbar,.pbar-spacer{display:none}
  #doc{padding:6px 10px;max-width:none}
  .stop-card{page-break-inside:avoid}
  .sig-table{page-break-inside:avoid}
}
</style>
</head>
<body>
<div id="loading"><div class="spin"></div>Loading…</div>
<div id="doc"></div>

<script>
// Airtable token REMOVED (S-1 remediation, 2026-07-13). This page now reads
// through the Cloudflare Worker with the logged-in user's JWT, same as core/api.js.
// The Worker holds the real PAT server-side. See .ai-notes/2026-07-13-rotation-day-runbook.md.
// NOTE: print.html is usually opened from the app (JWT present in localStorage).
// If opened cold with no tms_jwt, the Worker returns 401 — verify this path on cutover.
const PROXY_URL='https://petras-tms-backend-staging.petrasgroup.workers.dev';
const AT_BASE='appElT5CQV6JQvym8';
const T_ORDERS='tblgHlNmLBH3JTdIM',T_PARTNERS='tblLHl5m8bqONfhWv',
      T_TRUCKS='tblEAPExIAjiA3asD',T_TRAILERS='tblDcrqRJXzPrtYLm',
      T_DRIVERS='tbl7UGmYhc2Y82pPs',T_LOCS='tblxu8DRfTQOFRCzS',
      T_STOPS='tblaeY5QOHAS1gyE8';
var orderStops=[];
const DISPATCHER='Δ. Πέτρας';

const params=new URLSearchParams(window.location.search);
const orderId=params.get('orderId');
// Wave 3 (Π1): ?orderIds=a,b,c → ΟΜΑΔΙΚΗ εκτύπωση — ένα έγγραφο ανά order,
// διαδοχικά με page-break: ο οδηγός/συνεργάτης παίρνει ΕΝΑ πακέτο χαρτιών
// για το groupage αντί για Ν ξεχωριστά παράθυρα (PN-4 pattern, 00 §2).
const orderIdsCsv=params.get('orderIds');
const orderIdList=(orderIdsCsv?orderIdsCsv.split(','):(orderId?[orderId]:[])).map(function(s){return s.trim();}).filter(Boolean);
// Β.3-6: explicit sheet choice. ?sheet=partner|driver overrides the automatic
// isPartner detection so the DISPATCHER chooses what a third party sees —
// the sheet is no longer an accidental consequence of assignment state.
const sheetParam=params.get('sheet');
const leg=params.get('leg')||'export';

var allLocations=[],allPartners=[],allTrucks=[],allTrailers=[],allDrivers=[];

function fv(v){return Array.isArray(v)?v[0]||'':v||'';}
function fmt(s){if(!s)return'—';try{var p=s.split('T')[0].split('-');return p[2]+'/'+p[1]+'/'+p[0];}catch(e){return s;}}
// Format with time if time component is meaningful (not 00:00 or 12:00 sentinel)
function fmtDT(s){
  if(!s)return'—';
  try{
    var p=s.split('T');
    var d=p[0].split('-');
    var base=d[2]+'/'+d[1]+'/'+d[0];
    if(p[1]){
      var t=p[1].slice(0,5); // HH:MM
      // Skip sentinel times (00:00, 12:00) that usually indicate "time unknown"
      if(t!=='00:00'&&t!=='12:00') return base+' '+t;
    }
    return base;
  }catch(e){return s;}
}
function eur(v){if(!v&&v!==0)return'—';return parseFloat(v).toLocaleString('el-GR',{minimumFractionDigits:2,maximumFractionDigits:2})+' EUR';}

// Proxy-mode auth: send the logged-in user's JWT; the Worker swaps it for the PAT.
function atAuthHeader(){
  var jwt=localStorage.getItem('tms_jwt');
  return jwt?{Authorization:'Bearer '+jwt}:{};
}
async function atFetch(table,qs){
  var records=[],offset='';
  do{
    var url=PROXY_URL+'/v0/'+AT_BASE+'/'+table+'?pageSize=100'+(qs||'')+(offset?'&offset='+offset:'');
    var d=await(await fetch(url,{headers:atAuthHeader()})).json();
    records=records.concat(d.records||[]);offset=d.offset||'';
  }while(offset);return records;
}
async function atGet(table,id){
  return(await(await fetch(PROXY_URL+'/v0/'+AT_BASE+'/'+table+'/'+id,
    {headers:atAuthHeader()})).json());
}

function resolveLoc(locField){
  if(!locField||!Array.isArray(locField)||!locField.length)return null;
  var loc=allLocations.find(r=>r.id===locField[0]);if(!loc)return null;
  var l=loc.fields,parts=[];
  if(l['Address'])parts.push(l['Address']);if(l['City'])parts.push(l['City']);
  if(l['State/province'])parts.push(l['State/province']);if(l['Country'])parts.push(l['Country']);
  return{name:l['Name']||'—',address:parts.join(', '),lat:l['Latitude']||'',lng:l['Longitude']||'',
    hours:l['Opening Hours']||'',days:l['Delivery Days']||''}; // Wave 3
}

// Redesign 9/8: γλωσσικό στρώμα ανά φύλλο — Συνεργάτης=EN, Οδηγός=GR.
// Το LBL τίθεται στην αρχή του generatePDF, πριν χτιστούν οι κάρτες.
var LBL=null;
var LBL_EN={load:'LOAD',unload:'UNLOAD',dtLoad:'Date & Time of loading',dtDel:'Date & Time of delivery',
  hours:'Opening Hours',days:'Delivery Days',goods:'Goods',pal:'Pallets',palU:'pallets',
  pe:'Pallet Exchange',gw:'Gross Weight',temp:'Temperature',refr:'Refrigerator',
  yes:'YES',no:'NO',from:'From',to:'To',loadSec:'Loading Place',delSec:'Delivery Place',
  maps:'Open in Maps'};
var LBL_GR={load:'ΦΟΡΤΩΣΗ',unload:'ΠΑΡΑΔΟΣΗ',dtLoad:'Ημ/νία & ώρα φόρτωσης',dtDel:'Ημ/νία & ώρα παράδοσης',
  hours:'Ωράριο',days:'Ημέρες παράδοσης',goods:'Εμπόρευμα',pal:'Παλέτες',palU:'παλέτες',
  pe:'Ανταλλαγή παλετών',gw:'Μικτό βάρος',temp:'Θερμοκρασία',refr:'Ψυγείο',
  yes:'ΝΑΙ',no:'ΟΧΙ',from:'Από',to:'Προς',loadSec:'ΦΟΡΤΩΣΗ',delSec:'ΠΑΡΑΔΟΣΗ',
  maps:'Άνοιγμα στους Χάρτες'};

// dtLabel: 'loading' | 'delivery' | 'crossdock'
function buildCard(num,loc,dtLabel,dt,pals,palType,showDetails,goods,pe,gw,temp,refr){
  var L=LBL||LBL_EN;
  var typeCls='', typeLbl='';
  if(dtLabel==='loading'){typeCls='load'; typeLbl=L.load;}
  else if(dtLabel==='delivery'){typeCls='unload'; typeLbl=L.unload;}
  else if(dtLabel==='crossdock'){typeCls='crossdock'; typeLbl='CROSS-DOCK';}

  var h='<div class="stop-card '+typeCls+'">';
  h+='<div class="stop-name">';
  h+='<span class="stop-n '+typeCls+'">'+num+'</span>';
  if(typeLbl) h+='<span class="stop-badge '+typeCls+'">'+typeLbl+'</span>';
  h+='<span class="stop-title">'+loc.name+'</span></div>';
  if(loc.address)h+='<div class="stop-addr">'+loc.address+'</div>';
  if(loc.lat&&loc.lng)h+='<a class="stop-map" href="https://www.google.com/maps?q='+loc.lat+','+loc.lng+'" target="_blank">📍 '+L.maps+' ('+loc.lat+', '+loc.lng+')</a>';
  h+='<div class="stop-grid">';
  h+='<div class="stop-field"><b>'+(dtLabel==='delivery'?L.dtDel:L.dtLoad)+':</b><span>'+fmtDT(dt)+'</span></div>';
  if(loc.hours)h+='<div class="stop-field"><b>'+L.hours+':</b><span>'+loc.hours+'</span></div>';
  if(loc.days)h+='<div class="stop-field"><b>'+L.days+':</b><span>'+loc.days+'</span></div>';
  // «33 EUR» διάβαζε σαν χρήμα — τώρα: «33 × EUR παλέτες»
  var palLine='<div class="stop-field"><b>'+L.pal+':</b><span><b class="pal-n">'+(pals||'—')+'</b>&nbsp;× '+(palType||'EUR')+' '+L.palU+'</span></div>';
  if(showDetails){
    if(goods)h+='<div class="stop-field"><b>'+L.goods+':</b><span>'+goods+'</span></div>';
    h+=palLine;
    h+='<div class="stop-field"><b>'+L.pe+':</b><span>'+(pe==='YES'?L.yes:pe==='NO'?L.no:pe)+'</span></div>';
    if(gw)h+='<div class="stop-field"><b>'+L.gw+':</b><span>'+gw+' KG</span></div>';
    if(temp!==''&&temp!=null){
      var tNum=parseFloat(temp);
      var tCls=!isNaN(tNum)&&tNum<=-10?'temp-frozen':(!isNaN(tNum)&&tNum>=0&&tNum<=8?'temp-chilled':'temp-cold');
      var tLbl=!isNaN(tNum)&&tNum<=-10?' (FROZEN)':'';
      h+='<div class="stop-field"><b>'+L.temp+':</b><span class="'+tCls+'">'+temp+'°C'+tLbl+'</span></div>';
    }
    if(refr)h+='<div class="stop-field"><b>'+L.refr+':</b><span>'+refr+'</span></div>';
  }else{
    h+=palLine;
  }
  h+='</div></div>';return h;
}

// Route strip: μεγάλο «Από → Προς» με ημερομηνίες — το πρώτο που διαβάζεται.
function routeStrip(f,isExport,veroiaSwitch,VEROIA){
  var L=LBL||LBL_EN;
  function t(x){x=String(x||'').split(',')[0].trim();return x;}
  // Fallback στα ORDER_STOPS όταν τα Summaries λείπουν (stops-based orders)
  function stopName(type,last){
    var st=orderStops.filter(function(r){return r.fields['Stop Type']===type})
      .sort(function(a,b){return(a.fields['Stop Number']||0)-(b.fields['Stop Number']||0)});
    if(!st.length) return '';
    var loc=resolveLoc(st[last?st.length-1:0].fields['Location']);
    return loc?loc.name:'';
  }
  var from=(veroiaSwitch&&isExport)?VEROIA:(t(f['Loading Summary'])||stopName('Loading',false)||'—');
  var to=(veroiaSwitch&&!isExport)?VEROIA:(t(f['Delivery Summary'])||stopName('Unloading',true)||'—');
  var ld=f['Loading DateTime']||'', dd=f['Delivery DateTime']||'';
  try{
    if(veroiaSwitch&&isExport&&ld) ld=new Date(new Date(ld).getTime()+86400000).toISOString();
    if(veroiaSwitch&&!isExport&&dd) dd=new Date(new Date(dd).getTime()-86400000).toISOString();
  }catch(e){}
  return '<div class="route-strip">'+
    '<div class="rs-side"><div class="rs-lbl">'+L.from+'</div><div class="rs-name">'+from+'</div><div class="rs-date">'+fmtDT(ld)+'</div></div>'+
    '<div class="rs-arrow">→</div>'+
    '<div class="rs-side" style="text-align:right"><div class="rs-lbl">'+L.to+'</div><div class="rs-name">'+to+'</div><div class="rs-date">'+fmtDT(dd)+'</div></div>'+
  '</div>';
}

function buildLoadHTML(f,isExport,veroiaSwitch,VEROIA,VADDR,VLAT,VLNG){
  var dt=f['Loading DateTime']||'';
  if(veroiaSwitch&&isExport){
    var vDt=dt?new Date(new Date(dt).getTime()+86400000).toISOString():'';
    return buildCard(1,{name:VEROIA,address:VADDR,lat:VLAT,lng:VLNG},'loading',vDt,
      fv(f['Total Pallets']),fv(f['Pallet Type']),true,fv(f['Goods']),
      f['Pallet Exchange']?'YES':'NO',f['Gross Weight kg'],f['Temperature °C'],f['Refrigerator Mode']);
  }
  var loadStops=orderStops.filter(function(r){return r.fields['Stop Type']==='Loading'})
    .sort(function(a,b){return(a.fields['Stop Number']||0)-(b.fields['Stop Number']||0)});
  if(loadStops.length){
    var html='';
    for(var si=0;si<loadStops.length;si++){
      var sf=loadStops[si].fields;
      var loc=resolveLoc(sf['Location']);
      if(!loc)continue;
      var stopDt=sf['DateTime']||dt;
      html+=buildCard(si+1,loc,'loading',stopDt,sf['Pallets']||'',
        fv(f['Pallet Type']),si===0,sf['Goods']||fv(f['Goods']),
        f['Pallet Exchange']?'YES':'NO',f['Gross Weight kg'],
        sf['Temperature']!=null?sf['Temperature']:f['Temperature °C'],f['Refrigerator Mode']);
    }
    if(html)return html;
  }
  return buildCard(1,{name:'—',address:'',lat:'',lng:''},'loading',dt,
    fv(f['Total Pallets']),fv(f['Pallet Type']),true,fv(f['Goods']),
    f['Pallet Exchange']?'YES':'NO',f['Gross Weight kg'],f['Temperature °C'],f['Refrigerator Mode']);
}

function buildDelHTML(f,isExport,veroiaSwitch,VEROIA,VADDR,VLAT,VLNG){
  var dt=f['Delivery DateTime']||'';
  if(veroiaSwitch&&!isExport){
    var vDt=dt?new Date(new Date(dt).getTime()-86400000).toISOString():'';
    return buildCard(1,{name:VEROIA,address:VADDR,lat:VLAT,lng:VLNG},'delivery',vDt,
      fv(f['Total Pallets']),fv(f['Pallet Type']),false,'','','','','');
  }
  // Try ORDER_STOPS first
  var unloadStops=orderStops.filter(function(r){return r.fields['Stop Type']==='Unloading'})
    .sort(function(a,b){return(a.fields['Stop Number']||0)-(b.fields['Stop Number']||0)});
  if(unloadStops.length){
    var html='';
    for(var si=0;si<unloadStops.length;si++){
      var sf=unloadStops[si].fields;
      var loc=resolveLoc(sf['Location']);
      if(!loc)continue;
      var stopDt=sf['DateTime']||dt;
      html+=buildCard(si+1,loc,'delivery',stopDt,sf['Pallets']||'',
        fv(f['Pallet Type']),false,'','','','','');
    }
    if(html)return html;
  }
  return buildCard(1,{name:'—',address:'',lat:'',lng:''},'delivery',dt,
    fv(f['Total Pallets']),fv(f['Pallet Type']),false,'','','','','');
}

function badges(f){
  var b='';
  if(f['High Risk Flag'])b+='<span class="badge b-risk">! Risk</span>';
  if(f['Pallet Exchange'])b+='<span class="badge b-pe">PE</span>';
  if(f['National Groupage'])b+='<span class="badge b-grp">GRP</span>';
  if(f['Veroia Switch'])b+='<span class="badge b-veroia">Veroia</span>';
  return b;
}

async function loadAll(){
  if(!orderIdList.length){
    // PN-1: ήταν σκέτο «Missing orderId» χωρίς εξήγηση/επιστροφή — άστυλο
    // αδιέξοδο για όποιον άνοιγε τη σελίδα από παλιό/σπασμένο σύνδεσμο.
    document.getElementById('loading').innerHTML=
      '<div style="max-width:420px;margin:80px auto;text-align:center;font-family:\'DM Sans\',sans-serif">'
      +'<div style="font-family:\'Syne\',sans-serif;font-size:18px;font-weight:700;margin-bottom:8px">Λείπει ο κωδικός παραγγελίας</div>'
      +'<div style="font-size:13px;color:#475569;line-height:1.6">Αυτή η σελίδα εκτύπωσης ανοίγει από το κουμπί εγγράφων μιας παραγγελίας στο TMS — όχι απευθείας.</div>'
      +'<a href="app.html" style="display:inline-block;margin-top:16px;padding:8px 18px;border:1px solid #CBD5E1;border-radius:8px;color:#0284C7;text-decoration:none;font-size:13px">Επιστροφή στο TMS</a>'
      +'</div>';
    return;}
  // Cold-open guard (S-1 cutover): this page reads through the Worker with the
  // app's JWT. No JWT = every fetch would 401 into a blank page; say why instead.
  if(!localStorage.getItem('tms_jwt')){
    document.getElementById('loading').innerHTML=
      '<span style="color:#DC2626">Δεν υπάρχει ενεργή σύνδεση. Ανοίξτε την εφαρμογή TMS, συνδεθείτε, και ξαναπατήστε Print από εκεί.<br>'+
      'Not logged in — open the TMS app, log in, then use Print from there.</span>';
    return;
  }
  try{
    // Wave 3: Opening Hours / Delivery Days (owner-approved LOCATIONS fields).
    // Fallback without them until the Worker map + columns land — the sheet
    // must never break because the backend is a step behind.
    var LOC_BASE='&fields[]=Name&fields[]=Address&fields[]=City&fields[]=State/province&fields[]=Country&fields[]=Latitude&fields[]=Longitude';
    var fetchLocs=function(){
      return atFetch(T_LOCS,LOC_BASE+'&fields[]=Opening Hours&fields[]=Delivery Days')
        .catch(function(){return atFetch(T_LOCS,LOC_BASE);});
    };
    var[partners,trucks,trailers,drivers,locs]=await Promise.all([
      atFetch(T_PARTNERS,'&fields[]=Company Name&fields[]=VAT Number&fields[]=Adress&fields[]=Email'),
      atFetch(T_TRUCKS,'&fields[]=License Plate&fields[]=Gross Vehicle Weight kg'),
      atFetch(T_TRAILERS,'&fields[]=License Plate&fields[]=Weight kg'),
      atFetch(T_DRIVERS,'&fields[]=Full Name'),
      fetchLocs(),
    ]);
    allPartners=partners;allTrucks=trucks;allTrailers=trailers;
    allDrivers=drivers;allLocations=locs;
    // Wave 3 (Π1): one document per order, sequentially — single or group.
    var htmlArr=[];
    for(var oi=0;oi<orderIdList.length;oi++){
      var orderR=await atGet(T_ORDERS,orderIdList[oi]);
      orderStops=[];
      var stopIds=orderR.fields['ORDER STOPS']||[];
      if(stopIds.length){
        try{
          var stopFilter='OR('+stopIds.map(function(id){return'RECORD_ID()="'+id+'"'}).join(',')+')';
          orderStops=await atFetch(T_STOPS,'&filterByFormula='+encodeURIComponent(stopFilter));
        }catch(e){console.warn('print: ORDER_STOPS fetch failed',e);}
      }
      htmlArr.push(generatePDF(orderR, oi>0));
    }
    renderDocs(htmlArr);
  }catch(err){
    document.getElementById('loading').innerHTML='<span style="color:#DC2626">Error: '+err.message+'</span>';
  }
}

function generatePDF(orderRec, bare){ // bare (Wave 3): no toolbar — docs 2..N of a group
  var f=orderRec.fields;
  var isExport=leg==='export';
  var legLabel=isExport?'Export':'Import';
  var wk=f['Week Number']||f['Week Number']||'—';
  var rate=eur(f['Partner Rate']);
  var orderNo=f['Order Number']||String(orderRec.id||orderId||'').slice(-6).toUpperCase(); // group-safe (Wave 3 fix)
  var isPartner=sheetParam==='partner'?true:sheetParam==='driver'?false:!!(f['Is Partner Trip']||(f['Partner']||[]).length);
  LBL=isPartner?LBL_EN:LBL_GR; // Συνεργάτης=EN, Οδηγός=GR (redesign 9/8)
  var legLabelGr=isExport?'Εξαγωγή':'Εισαγωγή';

  // Veroia
  var veroiaSwitch=!!(f['Veroia Switch']);
  var VEROIA='VERMION FRESH / CROSS-DOCK',VADDR='',VLAT='',VLNG='';
  if(f['Veroia Cross-dock']){
    var vl=resolveLoc(f['Veroia Cross-dock']);
    if(vl){VEROIA=vl.name;VADDR=vl.address;VLAT=vl.lat;VLNG=vl.lng;}
  }
  // Orders that predate the Veroia Cross-dock link fall back to the canonical
  // LOCATIONS record (recJucKOhC1zh4IP3 — see CLAUDE.md). Data-driven: prints
  // whatever address the record carries; nothing is invented here.
  if(!VADDR){
    var vfb=resolveLoc(['recJucKOhC1zh4IP3']);
    if(vfb){if(!f['Veroia Cross-dock']){VEROIA=vfb.name;}VADDR=vfb.address;VLAT=VLAT||vfb.lat;VLNG=VLNG||vfb.lng;}
  }
  // Owner spec (Q2, 6/8): the partner sheet shows «απλά τη διεύθυνση» for the
  // Veroia stop — no CROSS-DOCK naming, no location name, no internal brand.
  // The card gets the ADDRESS as its title and nothing else.
  if(isPartner){ VEROIA=VADDR||'Loading Point'; VADDR=''; }

  var loadHTML=buildLoadHTML(f,isExport,veroiaSwitch,VEROIA,VADDR,VLAT,VLNG);
  var delHTML=buildDelHTML(f,isExport,veroiaSwitch,VEROIA,VADDR,VLAT,VLNG);
  var badgeHTML=badges(f);
  var rawNotes=f['Notes']||'';
  var urgent=/urgent|προσοχή|attention|critical|must|fragile|εύθραυστ|χειριστεί|χειρισμ|ασφαλ/i.test(rawNotes);
  var notesHTML=rawNotes?'<div class="notes-box'+(urgent?' urgent':'')+'"><b>'+(urgent?'⚠ ':'')+'Notes:</b> '+rawNotes+'</div>':'';

  var titleStr=isPartner?('Partner Assignment Order — '+legLabel+' — W'+wk):('Εντολή Οδηγού — '+legLabelGr+' — W'+wk);
  var pbarHTML=bare?'':'<div class="pbar"><div class="pbar-left">'+
    '<span class="pbar-logo">PETRAS<span> GROUP</span></span>'+
    '<div class="pbar-div"></div>'+
    '<span class="pbar-title">'+titleStr+'</span>'+
    '</div><button class="pbar-btn" onclick="window.print()">Print / PDF</button></div>'+
    '<div class="pbar-spacer"></div>';

  var refNo=f['Reference']||'';
  var _m=isPartner
    ?{date:'Date',week:'Week',cat:'Category',disp:'Dispatcher',ord:'Order No',ref:'Reference',flags:'Flags'}
    :{date:'Ημερομηνία',week:'Εβδομάδα',cat:'Κατηγορία',disp:'Dispatcher',ord:'Αρ. Εντολής',ref:'Reference',flags:'Σημάνσεις'};
  var metaHTML='<div class="meta">'+
    '<div class="meta-item"><span class="meta-lbl">'+_m.date+'</span><span class="meta-val">'+new Date().toLocaleDateString('el-GR')+' '+new Date().toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'})+'</span></div>'+
    '<div class="meta-item"><span class="meta-lbl">'+_m.week+'</span><span class="meta-val">W'+wk+'</span></div>'+
    '<div class="meta-item"><span class="meta-lbl">'+_m.cat+'</span><span class="meta-val">'+(isPartner?legLabel:legLabelGr)+'</span></div>'+
    '<div class="meta-item"><span class="meta-lbl">'+_m.disp+'</span><span class="meta-val">'+DISPATCHER+'</span></div>'+
    '<div class="meta-item"><span class="meta-lbl">'+_m.ord+'</span><span class="meta-val">'+orderNo+'</span></div>'+
    (refNo?'<div class="meta-item"><span class="meta-lbl">'+_m.ref+'</span><span class="meta-val">'+refNo+'</span></div>':'')+
    (badgeHTML&&!isPartner?'<div class="meta-item"><span class="meta-lbl">'+_m.flags+'</span><span class="meta-val">'+badgeHTML+'</span></div>':'')+
    '</div>';

  var html='';

  if(isPartner){
    var partner=allPartners.find(r=>f['Partner']&&r.id===f['Partner'][0])||{};
    var pf=partner.fields||{};
    html=pbarHTML+
    '<div class="doc-header">'+
      '<div>'+
        '<div class="carrier-label">Carrier</div>'+
        '<div class="carrier-name">'+(pf['Company Name']||'—')+'</div>'+
        '<div class="carrier-sub">'+
          (pf['VAT Number']?'VAT: '+pf['VAT Number']+'<br>':'')+
          (pf['Adress']?pf['Adress']+'<br>':'')+
          (pf['Email']||'')+
        '</div>'+
        '<div class="plates-tag">'+(f['Partner Truck Plates']||'—')+'</div>'+
      '</div>'+
      '<div class="brand-wrap">'+
        '<div class="brand">PETRAS<span> GROUP</span></div>'+
        '<div class="brand-sub">International Road Transport Services</div>'+
        '<div class="co-info"><b>VERMION FRESH SA</b><br>Kopanos, Naousa — Imathia, Greece<br>VAT: EL800816168<br>vermionfresh@petrasgroup.com</div>'+
      '</div>'+
    '</div>'+
    '<div class="doc-title">Partner Assignment Order — '+legLabel+' — PAO-W'+wk+'-'+orderNo+'</div>'+
    metaHTML+
    routeStrip(f,isExport,veroiaSwitch,VEROIA)+
    '<div class="price-bar">'+
      '<div><div class="price-lbl">Agreed Rate — '+legLabel+'</div><div class="price-amount">'+rate+'</div></div>'+
      '<div class="price-terms"><div class="price-lbl">Payment Terms</div><div class="val">30 days</div></div>'+
    '</div>'+
    '<div class="section-title load-section">'+LBL.loadSec+'</div>'+loadHTML+
    '<div class="section-title unload-section">'+LBL.delSec+'</div>'+delHTML+
    notesHTML+
    '<table class="sig-table"><tr>'+
      '<td><div class="sig-name">PETRAS GROUP / VERMION FRESH SA</div><div class="sig-role">Authorized Signatory</div><div class="sig-line">Signature &amp; Date</div></td>'+
      '<td><div class="sig-name">'+(pf['Company Name']||'CARRIER')+'</div><div class="sig-role">Authorized Signatory</div><div class="sig-line">Signature &amp; Date</div></td>'+
    '</tr></table>';
  }else{
    var driver=allDrivers.find(r=>f['Driver']&&r.id===f['Driver'][0])||{};
    var truck=allTrucks.find(r=>f['Truck']&&r.id===f['Truck'][0])||{};
    var trailer=allTrailers.find(r=>f['Trailer']&&r.id===f['Trailer'][0])||{};
    var df=driver.fields||{},tf=truck.fields||{},trf=trailer.fields||{};
    var truckW=parseFloat(tf['Gross Vehicle Weight kg']||tf['Weight kg']||0);
    var trailerW=parseFloat(trf['Weight kg']||trf['Gross Vehicle Weight kg']||0);
    var totalW=truckW+trailerW;
    html=pbarHTML+
    '<div class="doc-header">'+
      '<div class="brand-wrap" style="text-align:left">'+
        '<div class="brand">PETRAS<span> GROUP</span></div>'+
        '<div class="brand-sub">International Road Transport Services</div>'+
        '<div class="co-info" style="text-align:left"><b>VERMION FRESH SA</b><br>Kopanos, Naousa — Imathia<br>vermionfresh@petrasgroup.com</div>'+
      '</div>'+
      '<div style="text-align:right">'+
        '<div style="font-size:8.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#9CA3AF;margin-bottom:3px">Εντολή Οδηγού</div>'+
        '<div style="font-family:Syne,sans-serif;font-size:20px;font-weight:800;color:#0B1929">W'+wk+' — '+legLabelGr+'</div>'+
        '<div style="font-size:10.5px;color:#6B7280;margin-top:2px">'+new Date().toLocaleDateString('el-GR')+' · '+DISPATCHER+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="driver-block">'+
      '<div class="driver-block-row">'+
        '<div class="db-item"><div class="lbl">Οδηγός</div><div class="val">'+(df['Full Name']||'—')+'</div></div>'+
        '<div class="db-item"><div class="lbl">Φορτηγό</div><div class="val">'+(tf['License Plate']||'—')+'</div></div>'+
        '<div class="db-item"><div class="lbl">Τρέιλερ</div><div class="val">'+(trf['License Plate']||'—')+'</div></div>'+
        '<div class="db-item"><div class="lbl">Μικτό βάρος</div><div class="val">'+(totalW>0?totalW.toLocaleString('de-DE')+' KG':'—')+'</div></div>'+
      '</div>'+
    '</div>'+
    metaHTML+
    routeStrip(f,isExport,veroiaSwitch,VEROIA)+
    '<div class="section-title load-section">'+LBL.loadSec+'</div>'+loadHTML+
    '<div class="section-title unload-section">'+LBL.delSec+'</div>'+delHTML+
    notesHTML+
    '<table class="sig-table"><tr>'+
      '<td><div class="sig-name">VERMION FRESH SA / PETRAS GROUP</div><div class="sig-role">Dispatcher</div><div class="sig-line">Υπογραφή &amp; Ημερομηνία</div></td>'+
      '<td><div class="sig-name">'+(df['Full Name']||'—')+'</div><div class="sig-role">Οδηγός — Παραλαβή εντολής</div><div class="sig-line">Υπογραφή &amp; Ημερομηνία</div></td>'+
    '</tr></table>';
  }

  return html; // Wave 3: assembly + print moved to renderDocs (single & group)
}

// Wave 3 (Π1): assemble one or many documents. Group mode: page-break between
// docs + «ΕΓΓΡΑΦΟ i/N» tag, so the driver/partner gets ONE paper packet.
function renderDocs(htmlArr){
  document.getElementById('loading').style.display='none';
  var docEl=document.getElementById('doc');
  docEl.style.display='block';
  var N=htmlArr.length;
  docEl.innerHTML=htmlArr.map(function(h,i){
    var tag=N>1?'<div style="font-size:9px;font-weight:800;letter-spacing:1.2px;color:#6B7280;margin:0 0 8px">ΟΜΑΔΙΚΟ ΦΟΡΤΙΟ — ΕΓΓΡΑΦΟ '+(i+1)+' / '+N+'</div>':'';
    return '<div class="p-doc" style="'+(i<N-1?'page-break-after:always;':'')+'">'+tag+h+'</div>';
  }).join('');
  // &noprint=1: άνοιγμα για προεπισκόπηση/έλεγχο χωρίς διάλογο εκτύπωσης
  // (π.χ. λογιστήριο που απλώς διαβάζει, ή αυτοματοποιημένος έλεγχος).
  if(params.get('noprint')!=='1') setTimeout(()=>window.print(),700);
}

loadAll();
