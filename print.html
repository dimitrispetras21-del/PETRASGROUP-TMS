<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;font-size:11px;color:#111827;background:#fff;line-height:1.5}
#loading{display:flex;align-items:center;justify-content:center;height:90vh;
  font-size:13px;color:#6B7280;gap:10px;font-family:'DM Sans',sans-serif}
.spin{width:18px;height:18px;border:2px solid #E5E7EB;border-top-color:#0B1929;
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── PRINT BAR (screen only) ── */
.pbar{position:fixed;top:0;left:0;right:0;z-index:99;
  background:#0B1929;padding:10px 24px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:2px solid #172C45}
.pbar-left{display:flex;align-items:center;gap:14px}
.pbar-logo{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;
  letter-spacing:0.5px;color:#fff}
.pbar-logo span{color:#8B95A1}
.pbar-div{width:1px;height:16px;background:rgba(255,255,255,0.15)}
.pbar-title{font-size:11px;color:rgba(196,207,219,0.7);letter-spacing:0.3px}
.pbar-btn{background:#6B7280;color:#fff;border:none;padding:7px 20px;
  border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;
  font-family:'DM Sans',sans-serif;letter-spacing:0.4px;transition:background .12s}
.pbar-btn:hover{background:#4B5563}
.pbar-spacer{height:46px}

/* ── DOC WRAPPER ── */
#doc{display:none;padding:36px 44px;max-width:900px;margin:0 auto}

/* ── HEADER ── */
.doc-header{display:flex;justify-content:space-between;align-items:flex-start;
  padding-bottom:18px;margin-bottom:20px;
  border-bottom:3px solid #0B1929}
.carrier-label{font-size:8px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;color:#9CA3AF;margin-bottom:4px}
.carrier-name{font-size:15px;font-weight:700;color:#0B1929}
.carrier-sub{font-size:10.5px;color:#4B5563;line-height:1.7;margin-top:2px}
.plates-tag{display:inline-block;background:#0B1929;color:#fff;font-weight:700;
  font-size:12px;padding:3px 12px;border-radius:3px;margin-top:6px;letter-spacing:1px}
.brand-wrap{text-align:right}
.brand{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;
  color:#0B1929;letter-spacing:0.5px}
.brand span{color:#8B95A1}
.brand-sub{font-size:7.5px;color:#9CA3AF;letter-spacing:2px;text-transform:uppercase;margin-top:1px}
.co-info{margin-top:6px;font-size:10.5px;color:#4B5563;line-height:1.7;text-align:right}
.co-info b{color:#0B1929;font-weight:600}

/* ── DRIVER BLOCK (owned fleet) ── */
.driver-block{background:#0B1929;border-radius:6px;padding:12px 18px;margin-bottom:18px}
.driver-block-row{display:flex;gap:32px;align-items:center}
.db-item .lbl{font-size:8px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;color:rgba(196,207,219,0.55);margin-bottom:2px}
.db-item .val{font-size:13px;font-weight:700;color:#fff;letter-spacing:0.3px}

/* ── DOC TITLE ── */
.doc-title{text-align:center;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;
  padding:9px 0;margin:0 0 16px;
  border-top:2px solid #0B1929;border-bottom:2px solid #0B1929;
  letter-spacing:1.2px;text-transform:uppercase;color:#0B1929}

/* ── META GRID ── */
.meta{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:16px;
  border:1px solid #E5E7EB;border-radius:6px;overflow:hidden}
.meta-item{padding:7px 14px;border-bottom:1px solid #F3F4F6;
  display:flex;gap:10px;align-items:center}
.meta-item:nth-child(odd){border-right:1px solid #F3F4F6}
.meta-item:last-child,.meta-item:nth-last-child(2){border-bottom:none}
.meta-lbl{font-size:9px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:#9CA3AF;min-width:72px;flex-shrink:0}
.meta-val{font-size:11px;font-weight:600;color:#111827}

/* ── PRICE BAR ── */
.price-bar{display:flex;justify-content:space-between;align-items:center;

.price-terms{text-align:right}

/* ── SECTION TITLE (navy accent — matches app palette) ── */

.section-title.load-section{border-left-color:#0B1929;color:#0B1929}
.section-title.unload-section{border-left-color:#8B95A1;color:#475569}

/* ── STOP CARD (navy/silver tones — matches app) ── */
.stop-card{border:1px solid #E5E7EB;border-left:4px solid #0B1929;border-radius:6px;padding:12px 16px;
  margin-bottom:8px;background:#FAFAFA;position:relative}
.stop-card.load{border-left-color:#0B1929}
.stop-card.unload{border-left-color:#8B95A1}
.stop-card.crossdock{border-left-color:#0284C7}
.stop-name{font-size:14px;font-weight:700;color:#0B1929;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.stop-badge{font-size:8px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;

.stop-badge.unload{background:#475569}
.stop-badge.crossdock{background:#0284C7}
.stop-addr{font-size:10.5px;color:#6B7280;margin-bottom:6px}
.stop-map{font-size:10px;color:#0284C7;text-decoration:none;display:inline-block;margin-bottom:6px}

.stop-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 24px}
.stop-field{display:flex;gap:8px;padding:2px 0;font-size:13px}
.stop-field b{color:#374151;min-width:116px;font-weight:600;flex-shrink:0}
.stop-field span{color:#111827}
/* Temperature — subtle navy tone emphasis, no clashing colors */
.temp-cold{color:#0B1929;font-weight:700}
.temp-frozen{color:#0B1929;font-weight:700;letter-spacing:0.3px}
.temp-chilled{color:#0284C7;font-weight:700}

/* ── BADGE ── */
.badge{display:inline-block;font-size:8px;font-weight:800;letter-spacing:0.8px;
  text-transform:uppercase;padding:2px 7px;border-radius:3px;
  color:#fff;margin-left:6px;vertical-align:middle}
.b-risk   {background:#DC2626}
.b-pe     {background:#059669}
.b-grp    {background:#0EA5E9}

<script>
// Airtable token REMOVED (S-1 remediation, 2026-07-13). This page now reads
// through the Cloudflare Worker with the logged-in user's JWT, same as core/api.js.
// The Worker holds the real PAT server-side. See .ai-notes/2026-07-13-rotation-day-runbook.md.
// NOTE: print.html is usually opened from the app (JWT present in localStorage).
// If opened cold with no tms_jwt, the Worker returns 401 — verify this path on cutover.
const PROXY_URL='https://petras-tms-backend-staging.petrasgroup.workers.dev';
const AT_BASE='appElT5CQV6JQvym8';
const T_ORDERS='tblgHlNmLBH3JTdIM',T_PARTNERS='tblLHl5m8bqONfhWv',
      T_TRUCKS='tblEAPExIAjiA3asD',T_TRAILERS='tblDcrqRJXzPrtYLm',
      T_DRIVERS='tbl7UGmYhc2Y82pPs',T_LOCS='tblxu8DRfTQOFRCzS',
      T_STOPS='tblaeY5QOHAS1gyE8',T_CLIENTS='tblFWKAQVUzAM8mCE';
var orderStops=[];
// Ονοματεπώνυμο του χρήστη που εκτυπώνει (owner 12/8) — ίδιο origin, οπότε
// διαβάζεται το tms_user του app· fallback στον owner αν λείπει.
// Printed only into HTML (meta grid, sheet header, cover): escaped once here.
const DISPATCHER=(function(){try{return escHtml(JSON.parse(localStorage.getItem('tms_user')||'{}').name||'Δ. Πέτρας');}catch(e){return 'Δ. Πέτρας';}})();
// Επικοινωνία στα φύλλα/WhatsApp — συμπλήρωσε τα τηλέφωνα (κενό = δεν τυπώνεται)
const OFFICE_PHONE='';      // π.χ. '+30 23320 XXXXX'
const EMERGENCY_PHONE='';   // π.χ. '+30 69X XXX XXXX'
const OFFICE_EMAIL='vermionfresh@petrasgroup.com';  // owner 12/8
const INVOICE_EMAIL='invoice@petrasgroup.com';          // owner 12/8
var _waArr=[]; // WhatsApp texts: one per single order; a group = ONE (waGroupBuild), per-order only as its fallback

const params=new URLSearchParams(window.location.search);
const orderId=params.get('orderId');
// Wave 3 (Π1): ?orderIds=a,b,c → ΟΜΑΔΙΚΗ εκτύπωση — ένα έγγραφο ανά order,
// διαδοχικά με page-break: ο οδηγός/συνεργάτης παίρνει ΕΝΑ πακέτο χαρτιών
// για το groupage αντί για Ν ξεχωριστά παράθυρα (PN-4 pattern, 00 §2).
const orderIdsCsv=params.get('orderIds');
const orderIdList=(orderIdsCsv?orderIdsCsv.split(','):(orderId?[orderId]:[])).map(function(s){return s.trim();}).filter(Boolean);
// Β.3-6: explicit sheet choice. ?sheet=partner|driver overrides the automatic
// isPartner detection so the DISPATCHER chooses what a third party sees —
// the sheet is no longer an accidental consequence of assignment state.
const sheetParam=params.get('sheet');
const leg=params.get('leg')||'export';

var allLocations=[],allPartners=[],allTrucks=[],allTrailers=[],allDrivers=[];

function fv(v){return Array.isArray(v)?v[0]||'':v||'';}
function fmt(s){if(!s)return'—';try{var p=s.split('T')[0].split('-');return p[2]+'/'+p[1]+'/'+p[0];}catch(e){return s;}}
// Format with time if time component is meaningful (not 00:00 or 12:00 sentinel)
function fmtDT(s){
  if(!s)return'—';
  try{
    var p=s.split('T');
    var d=p[0].split('-');
    var base=d[2]+'/'+d[1]+'/'+d[0];
    if(p[1]){
      var t=p[1].slice(0,5); // HH:MM
      // Skip sentinel times (00:00, 12:00) that usually indicate "time unknown"
      if(t!=='00:00'&&t!=='12:00') return base+' '+t;
    }
    return base;
  }catch(e){return s;}
}
function eur(v){if(!v&&v!==0)return'—';return parseFloat(v).toLocaleString('el-GR',{minimumFractionDigits:2,maximumFractionDigits:2})+' EUR';}
// Every text that comes from data is escaped where it is concatenated into
// HTML (sheets, cover, title bar). The WhatsApp text (waBuild) is plain text
// and stays unescaped; URLs built from data encode the data parts.
function escHtml(s){ return s == null ? '' : String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

// This page loads no core/utils.js, so it has no logError. A failure that
// changes what the driver receives is reported to the same store the app
// uses (POST /app-errors → app_errors), so the office learns it from the log,
// not from the driver (principle 1). Same guards as utils.js _postAppError:
// it never throws, and a local rig (localhost/127.0.0.1, HAR replays with
// fake ids) never writes the production log — there the console keeps it.
function printLogError(err,ctx){
  console.error('[print] '+ctx+':',err);
  try{
    if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname))return;
    var h={'Content-Type':'application/json'}, jwt=localStorage.getItem('tms_jwt');
    if(jwt)h.Authorization='Bearer '+jwt;
    fetch(PROXY_URL+'/app-errors',{method:'POST',headers:h,keepalive:true,body:JSON.stringify({
      message:(ctx+': '+((err&&err.message)||String(err))).slice(0,2000),
      stack:(err&&err.stack)||undefined,page:location.href,user_agent:navigator.userAgent
    })}).catch(function(){});
  }catch(_){}
}
// Proxy-mode auth: send the logged-in user's JWT; the Worker swaps it for the PAT.
function atAuthHeader(){
  var jwt=localStorage.getItem('tms_jwt');
  return jwt?{Authorization:'Bearer '+jwt}:{};
}
async function atFetch(table,qs){
  var records=[],offset='';
  do{
    var url=PROXY_URL+'/v0/'+AT_BASE+'/'+table+'?pageSize=100'+(qs||'')+(offset?'&offset='+offset:'');
    var d=await(await fetch(url,{headers:atAuthHeader()})).json();
    records=records.concat(d.records||[]);offset=d.offset||'';
  }while(offset);return records;
}
async function atGet(table,id){
  return(await(await fetch(PROXY_URL+'/v0/'+AT_BASE+'/'+table+'/'+id,
    {headers:atAuthHeader()})).json());
}

function resolveLoc(locField){
  if(!locField||!Array.isArray(locField)||!locField.length)return null;
  var loc=allLocations.find(r=>r.id===locField[0]);if(!loc)return null;
  var l=loc.fields,parts=[];
  if(l['Address'])parts.push(l['Address']);if(l['City'])parts.push(l['City']);
  if(l['State/province'])parts.push(l['State/province']);
  // Redesign 9/8 language layer (LBL_EN/LBL_GR, set by generatePDF before any
  // card is built): the driver sheet reads Greek, the partner sheet English —
  // the country name now follows the same rule, whatever spelling/code the
  // location record stores (one list everywhere, owner 5/9).
  if(l['Country']){
    var isPartnerSheet=(typeof LBL!=='undefined'&&LBL===LBL_EN);
    parts.push(typeof countryName==='function'
      ? countryName(l['Country'], isPartnerSheet?'en':'el') : l['Country']);
  }
  return{name:l['Name']||'—',address:parts.join(', '),lat:l['Latitude']||'',lng:l['Longitude']||'',
    hours:l['Opening Hours']||'',days:l['Delivery Days']||''}; // Wave 3
}

// v2.1: QR ανά σημείο (εγκεκριμένο #3) — εικόνα από api.qrserver.com με το
// Maps link· αν δεν φορτώσει (offline/μπλοκ) κρύβεται, το link μένει τυπωμένο.
function stopQR(lat,lng){
  if(!lat||!lng) return '';
  var u='https://maps.google.com/?q='+encodeURIComponent(lat)+','+encodeURIComponent(lng);
  return '<img class="stop-qr" alt="" onerror="this.style.display=\'none\'" src="https://api.qrserver.com/v1/create-qr-code/?size=148x148&margin=0&data='+encodeURIComponent(u)+'">';
}
var _stopSeq=0; // συνεχής αρίθμηση σημείων ανά έγγραφο (①②③…)
// Shared filter+sort used by buildLoadHTML/buildDelHTML/buildCrossdockHTML,
// routeStrip and waBuild — was duplicated inline in each (audit finding #6).
function stopsOfType(stops,type){
  return(stops||[]).filter(function(r){return r.fields['Stop Type']===type;})
    .sort(function(a,b){return(a.fields['Stop Number']||0)-(b.fields['Stop Number']||0);});
}
// A DB date column with no time-of-day component (no 'T', per fmtDT above)
// must not be labelled "& ώρα/Time" — audit finding #4.
function hasTime(s){
  if(!s)return false;
  var t=String(s).split('T')[1]; if(!t)return false;
  t=t.slice(0,5); return t!=='00:00'&&t!=='12:00';
}
// «Κατά CMR» (owner 7/10, Παντελής): the order's temperature is the one its
// CMR states — no number. The same rule as OrdersCommon.tempText in the app
// (this page loads no core JS). The flag wins over any figure, the order's or
// a stop's: a leftover number must never reach the driver as the temperature.
// Returns the text to print — '2°C', the CMR wording, or '' (none) — so every
// card, chip and cover reads one answer. 'Temp Per CMR' absent = a Worker that
// does not map it yet = a numbered order, exactly as before.
function tempPerCmr(f){return !!f&&f['Temp Per CMR']===true;}
function ordTemp(f,sf){
  var L=LBL||LBL_EN;
  if(tempPerCmr(f))return L.tempCmr;
  var t=(sf&&sf['Temperature']!=null)?sf['Temperature']:(f||{})['Temperature °C'];
  return(t!==''&&t!=null)?t+'°C':'';
}
// Owner 7/10: EVERY sheet (and every WhatsApp text, waBuild) tells the driver
// to keep the temperature on the CMR — with or without a number of ours.
function keepCmrHTML(){return '<div class="cmr-keep">🌡 '+escHtml((LBL||LBL_EN).keepCmr)+'</div>';}
// dtLabel: 'loading' | 'delivery' | 'crossdock'
// tag (optional, group cover only — finding #6): small order-of-origin label
// printed next to the type badge, e.g. "ΠΑΡΑΓΓΕΛΙΑ A · 269 · Lidl Ecser".
// tag arrives as HTML: buildCoverDoc escapes its data parts.
function buildCard(num,loc,dtLabel,dt,pals,palType,showDetails,goods,pe,gw,temp,refr,tag){
  var L=LBL||LBL_EN;
  var typeCls='', typeLbl='';
  if(dtLabel==='loading'){typeCls='load'; typeLbl=L.load;}
  else if(dtLabel==='delivery'){typeCls='unload'; typeLbl=L.unload;}
  else if(dtLabel==='crossdock'){typeCls='crossdock'; typeLbl='CROSS-DOCK';}
  var seq=++_stopSeq;
  var mapsUrl=(loc.lat&&loc.lng)?'https://maps.google.com/?q='+encodeURIComponent(loc.lat)+','+encodeURIComponent(loc.lng):'';

  var h='<div class="stop '+typeCls+'">';
  h+='<div class="num">'+seq+'</div>';
  h+=stopQR(loc.lat,loc.lng);
  h+='<span class="type">'+typeLbl+'</span>';
  if(tag)h+='<span class="stoptag">'+tag+'</span>';
  h+='<div class="name">'+escHtml(loc.name)+'</div>';
  var addrBits=[];
  if(loc.address)addrBits.push(escHtml(loc.address));
  if(mapsUrl)addrBits.push(L.coords+': '+escHtml(loc.lat)+', '+escHtml(loc.lng)+' · <a href="'+escHtml(mapsUrl)+'" target="_blank">📍 '+escHtml(mapsUrl.replace('https://',''))+'</a>');
  if(addrBits.length)h+='<div class="addr">'+addrBits.join('<br>')+'</div>';
  h+='<div class="grid">';
  var withTime=hasTime(dt);
  var dtLbl=dtLabel==='delivery'?(withTime?L.dtDel:L.dtDelDateOnly):(withTime?L.dtLoad:L.dtLoadDateOnly);
  h+='<div class="f"><b>'+dtLbl+'</b><span class="big">'+escHtml(fmtDT(dt))+'</span></div>';
  if(loc.hours)h+='<div class="f"><b>'+L.hours+'</b><span>'+escHtml(loc.hours)+'</span></div>';
  if(loc.days)h+='<div class="f"><b>'+L.days+'</b><span>'+escHtml(loc.days)+'</span></div>';
  h+='<div class="f"><b>'+L.pal+'</b><span>'+escHtml(pals||'—')+' × '+escHtml(palType||'EUR')+'</span></div>';
  if(showDetails){
    if(goods)h+='<div class="f"><b>'+L.goods+'</b><span>'+escHtml(goods)+'</span></div>';
    h+='<div class="f"><b>'+L.pe+'</b><span class="'+(pe==='YES'?'hot':'')+'">'+(pe==='YES'?L.yes:pe==='NO'?L.no:escHtml(pe))+'</span></div>';
    if(gw)h+='<div class="f"><b>'+L.gw+'</b><span>'+escHtml(gw)+' KG</span></div>';
    // temp: the printable text from ordTemp ('2°C' / the CMR wording / '').
    if(temp)h+='<div class="f"><b>'+L.temp+'</b><span class="hot">'+escHtml(temp)+'</span></div>';
    if(refr)h+='<div class="f"><b>'+L.refr+'</b><span>'+escHtml(refr)+'</span></div>';
  }
  h+='</div><div style="clear:both"></div></div>';return h;
}

// Route strip: μεγάλο «Από → Προς» με ημερομηνίες — το πρώτο που διαβάζεται.
// Flat-column fallback (7/9/2026): a split leg (migration 018) and any older
// order may have NO ORDER STOPS and NO summaries — the truth is then the order's
// own Loading Location 1 / last Unloading Location N. Without this the sheet
// printed «—» for a real place (owner: «τα στοιχεία δεν μεταφέρθηκαν»).
function flatLoc(f,type,last){
  if(!f) return null;
  if(type==='Loading') return resolveLoc(f['Loading Location 1'])||null;
  for(var i=(last?10:1);last?i>=1:i<=10;last?i--:i++){
    var v=f['Unloading Location '+i]; if(v&&v.length){ var l=resolveLoc(v); if(l) return l; }
  }
  return null;
}
// The date of an order's Veroia cross-dock stop — ONE rule for the sheet's
// Veroia card (buildLoadHTML/buildDelHTML), its header strip (routeStrip), the
// WhatsApp texts and the group cover (routeStops). Owner (locked 23/8): ONE
// cross-dock column; the estimate only when it is empty — export Loading +1
// day, import Delivery −1 day. Until 7/10 the WhatsApp text always printed the
// estimate, so an order whose real cross-dock date differs told the driver one
// day on the phone and another on the paper (review 7/10, finding 3).
// The day is shifted on the written date itself, never through
// Date→toISOString(): a local-time value («…T07:00:00», no zone) parsed in an
// Athens browser came back 3 hours earlier in UTC («09/10 04:00»), and near
// midnight on the wrong day. The time of day, when there is one, is kept as
// written — fmtDT prints every other stop the same way.
function vsCdDate(f,isExport){
  var real=f['Cross-dock Date']||f['VS CD Date'];
  if(real)return String(real);
  var base=isExport?f['Loading DateTime']:f['Delivery DateTime'];
  return base?shiftDay(base,isExport?1:-1):'';
}
function shiftDay(s,n){
  s=String(s);
  var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m)return s;
  // UTC arithmetic on a date-only value: no local zone, no DST hour to lose.
  var d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]+n));
  function p(x){return (x<10?'0':'')+x;}
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+s.slice(10);
}
function routeStrip(f,isExport,veroiaSwitch,VEROIA){
  var L=LBL||LBL_EN;
  function t(x){x=String(x||'').split(',')[0].trim();return x;}
  // First loading / last unloading stop of the order, by Stop Number.
  function stopAt(type,last){
    var st=stopsOfType(orderStops,type);
    return st.length?st[last?st.length-1:0]:null;
  }
  // Fallback στα ORDER_STOPS όταν τα Summaries λείπουν (stops-based orders)
  function stopName(type,last){
    var s=stopAt(type,last); if(!s) return '';
    var loc=resolveLoc(s.fields['Location']);
    return loc?loc.name:'';
  }
  var from=(veroiaSwitch&&isExport)?VEROIA:(t(f['Loading Summary'])||stopName('Loading',false)||(flatLoc(f,'Loading',false)||{}).name||'—');
  var to=(veroiaSwitch&&!isExport)?VEROIA:(t(f['Delivery Summary'])||stopName('Unloading',true)||(flatLoc(f,'Unloading',true)||{}).name||'—');
  var ld=f['Loading DateTime']||'', dd=f['Delivery DateTime']||'';
  // One source for the dates (5/9): the stop's own DateTime, exactly as the
  // cards below read it (buildLoadHTML/buildDelHTML: sf['DateTime']||dt). The
  // strip used to read only the order-level dates, so a rescheduled stop made
  // the header and the cards of the SAME sheet disagree — the driver reads the
  // header. Order-level date only when the stop has none / there are no stops.
  // The Veroia legs keep the order-level base: their card does the same.
  if(!(veroiaSwitch&&isExport)){var ls=stopAt('Loading',false); if(ls&&ls.fields['DateTime']) ld=ls.fields['DateTime'];}
  if(!(veroiaSwitch&&!isExport)){var us=stopAt('Unloading',true); if(us&&us.fields['DateTime']) dd=us.fields['DateTime'];}
  // The Veroia leg: vsCdDate, the one Veroia date rule (it reads the order-level
  // dates — the stop override above skips this leg, as its card does).
  if(veroiaSwitch&&isExport) ld=vsCdDate(f,true);
  if(veroiaSwitch&&!isExport) dd=vsCdDate(f,false);
  return '<div class="route2">'+
    '<div class="side"><div class="k">'+L.from+'</div><div class="n">'+escHtml(from)+'</div><div class="d">'+escHtml(fmtDT(ld))+'</div></div>'+
    '<div class="mid">→</div>'+
    '<div class="side to"><div class="k">'+L.to+'</div><div class="n">'+escHtml(to)+'</div><div class="d">'+escHtml(fmtDT(dd))+'</div></div>'+
  '</div>';
}

function buildLoadHTML(f,isExport,veroiaSwitch,VEROIA,VADDR,VLAT,VLNG){
  var dt=f['Loading DateTime']||'';
  if(veroiaSwitch&&isExport){
    var vDt=vsCdDate(f,true);
    return buildCard(1,{name:VEROIA,address:VADDR,lat:VLAT,lng:VLNG},'loading',vDt,
      fv(f['Total Pallets']),fv(f['Pallet Type']),true,fv(f['Goods']),
      f['Pallet Exchange']?'YES':'NO',f['Gross Weight kg'],ordTemp(f),f['Refrigerator Mode']);
  }
  var loadStops=stopsOfType(orderStops,'Loading');
  if(loadStops.length){
    var html='';
    for(var si=0;si<loadStops.length;si++){
      var sf=loadStops[si].fields;
      var loc=resolveLoc(sf['Location']);
      if(!loc)continue;
      var stopDt=sf['DateTime']||dt;
      html+=buildCard(si+1,loc,'loading',stopDt,sf['Pallets']||'',
        fv(f['Pallet Type']),si===0,sf['Goods']||fv(f['Goods']),
        f['Pallet Exchange']?'YES':'NO',f['Gross Weight kg'],
        ordTemp(f,sf),f['Refrigerator Mode']);
    }
    if(html)return html;
  }
  var flL=flatLoc(f,'Loading',false);
  return buildCard(1,flL||{name:'—',address:'',lat:'',lng:''},'loading',dt,
    fv(f['Loading Pallets 1'])||fv(f['Total Pallets']),fv(f['Pallet Type']),true,fv(f['Goods']),
    f['Pallet Exchange']?'YES':'NO',f['Gross Weight kg'],ordTemp(f),f['Refrigerator Mode']);
}

function buildDelHTML(f,isExport,veroiaSwitch,VEROIA,VADDR,VLAT,VLNG){
  var dt=f['Delivery DateTime']||'';
  if(veroiaSwitch&&!isExport){
    var vDt=vsCdDate(f,false);
    return buildCard(1,{name:VEROIA,address:VADDR,lat:VLAT,lng:VLNG},'delivery',vDt,
      fv(f['Total Pallets']),fv(f['Pallet Type']),false,'','','','','');
  }
  // Try ORDER_STOPS first
  var unloadStops=stopsOfType(orderStops,'Unloading');
  if(unloadStops.length){
    var html='';
    for(var si=0;si<unloadStops.length;si++){
      var sf=unloadStops[si].fields;
      var loc=resolveLoc(sf['Location']);
      if(!loc)continue;
      var stopDt=sf['DateTime']||dt;
      // Finding #3: this used to pass showDetails=false and blank strings, so
      // a stop's own Goods/Temperature (present in ORDER STOPS) never printed
      // on the delivery card even when the loading card showed the same data
      // for its stop. Mirror buildLoadHTML's per-stop pattern exactly —
      // details (incl. goods/temp) only on the first card, order-level PE/GW
      // fallback like the loading side.
      // Round 1 O10 (critic-4 C4-03): a LOT's delivery is the warehouse
      // intake — no pallet exchange there (Ε5: the one exchange is at the
      // client's loading; pallet-feed writes nothing at intake, Q7 default).
      // YES here sent the partner's driver to claim empties the ledger never sees.
      html+=buildCard(si+1,loc,'delivery',stopDt,sf['Pallets']||'',
        fv(f['Pallet Type']),si===0,sf['Goods']||fv(f['Goods']),
        f['Pallet Exchange']&&!f['Own Stock Lot']?'YES':'NO',f['Gross Weight kg'],
        ordTemp(f,sf),f['Refrigerator Mode']);
    }
    if(html)return html;
  }
  var flU=flatLoc(f,'Unloading',true);
  return buildCard(1,flU||{name:'—',address:'',lat:'',lng:''},'delivery',dt,
    fv(f['Unloading Pallets 1'])||fv(f['Total Pallets']),fv(f['Pallet Type']),false,'','','','','');
}

// Finding #2: a 'Cross-dock' stop (Veroia Switch, real ORDER STOPS row) was
// silently dropped — buildLoadHTML only reads 'Loading', buildDelHTML only
// 'Unloading'. Render it as its own card (buildCard already supports
// dtLabel==='crossdock'), same per-stop pattern as the loading/delivery cards.
function buildCrossdockHTML(f){
  var cdStops=stopsOfType(orderStops,'Cross-dock');
  if(!cdStops.length)return'';
  var html='';
  for(var si=0;si<cdStops.length;si++){
    var sf=cdStops[si].fields;
    var loc=resolveLoc(sf['Location']);
    if(!loc)continue;
    html+=buildCard(si+1,loc,'crossdock',sf['DateTime']||'',sf['Pallets']||'',
      fv(f['Pallet Type']),si===0,sf['Goods']||fv(f['Goods']),
      f['Pallet Exchange']?'YES':'NO',f['Gross Weight kg'],
      ordTemp(f,sf),f['Refrigerator Mode']);
  }
  return html;
}

// PR-05 (impact map 4/10): a stock piece leaves FROM STOCK — its sheet says so
// and names the lot the warehouse releases. The order is read with one GET and
// no fields[] (atGet below), so «Stock Lot» and «Stock Lot Order No» arrive
// with every other column. No money. OWNER-Q10 answered 4/10 (client name on
// piece driver sheet): the DRIVER sheet also names the client (stockLotText).
// Same «#312» / «Ε-27» rule as OrdersStock.lotNumLabel (core/orders-common.js);
// tests/orders-stock.test.js keeps the two in step (this page loads no core JS).
// C4-06 (round 3): ONE definition of a piece, as in the app (OrdersStock.isPiece):
// the «Stock Lot» link. A piece whose number is not served still prints as a
// piece — «παρτίδα —» — never silently as an ordinary order.
function stockLotLabel(f){
  if(!f||!Array.isArray(f['Stock Lot'])||!f['Stock Lot'].length)return '';
  var n=f['Stock Lot Order No'];
  return n?(f['Stock Lot Source']==='natl'?'Ε-':'#')+n:'—';
}
// One stock text for the meta grid, the WhatsApp text and the cover's stop
// tag (round 1 O10, critic-4 C4-02/C4-05): the warehouse knows the goods by
// the lot's REFERENCE (printed on its intake sheet), never by our #N — so the
// Reference leads, served by the Worker as ORDERS «Stock Lot Reference».
// Before that label exists it is absent (facade trap #2) and the line falls
// back to the lot number alone. No «ΑΠ ·» (it abbreviated the label next to it).
// OWNER-Q10 answered 4/10 (client name on piece driver sheet): «Ναι, και
// πελάτης» — the warehouse releases the goods by lot AND client. Driver sheet
// only (the partner sheet goes to a third-party carrier and stays as it was).
// The piece's OWN «Client» link: the base refuses a piece whose client is not
// the lot's (piece_mismatch), so it is the lot's client. A name that could not
// be read (a role without CLIENTS, e.g. warehouse → 403; a failed read) prints
// «—», never a gap that reads as «no client».
function stockLotText(f,isPartner){
  var n=stockLotLabel(f); if(!n)return '';
  var ref=String(f['Stock Lot Reference']||'').trim();
  var who=isPartner?'':' · '+(pieceClients[fv(f['Client'])]||'—');
  return (ref?'Ref '+ref+' · ':'')+(isPartner?'lot ':'παρτίδα ')+n+who;

async function loadPieceClients(items){

// The stops of ONE order as the driver drives them: {loads, dels}, each entry
// {name, addr, lat, lng, dt, loc, sf}. ONE producer for the single WhatsApp
// text, the group WhatsApp text and the group cover (owner 7/10, principle 3):
// the phone and the paper list the same places with the same dates. Veroia
// Switch replaces the export loading / the import delivery with the cross-dock
// on vsCdDate — the real cross-dock date, the ±1 day estimate only when it is
// empty — the date the order's own sheet prints on its Veroia card.
// Without ORDER STOPS: the summary's first part, else the order's own flat
// location (flatLoc — split legs carry neither stops nor summaries; their own
// sheet already prints the place from it, the text and the cover said «—»).
// loc = the resolved LOCATIONS record (hours/days for the paper), sf = the
// ORDER STOPS fields (its pallets); sf absent for a Veroia/summary/flat entry.
// An unresolved location stays as «—» (never dropped): the driver must still
// see that there is a stop there.
function routeStops(f,stops,isExport,veroiaSwitch,V){
  function t(x){x=String(x||'').split(',')[0].trim();return x;}
  function fromStops(type){
    return stopsOfType(stops,type)
      .map(function(r){var lc=resolveLoc(r.fields['Location'])||{};
        return {name:lc.name||'—',addr:lc.address||'',lat:lc.lat,lng:lc.lng,dt:r.fields['DateTime']||'',loc:lc,sf:r.fields};});
  }
  // No stops: the summary as before (unchanged text), else the flat column.
  function noStops(sum,fl,dt){
    if(sum)return [{name:sum,addr:'',dt:dt}];
    if(fl)return [{name:fl.name||'—',addr:fl.address||'',lat:fl.lat,lng:fl.lng,dt:dt,loc:fl}];
    return [{name:'—',addr:'',dt:dt}];
  }
  var ld=f['Loading DateTime']||'', dd=f['Delivery DateTime']||'';
  var loads,dels;
  try{
    if(veroiaSwitch&&isExport){loads=[{name:V.name,addr:V.addr,lat:V.lat,lng:V.lng,dt:vsCdDate(f,true)}];}
    else{loads=fromStops('Loading'); if(!loads.length)loads=noStops(t(f['Loading Summary']),flatLoc(f,'Loading',false),ld);}
    if(veroiaSwitch&&!isExport){dels=[{name:V.name,addr:V.addr,lat:V.lat,lng:V.lng,dt:vsCdDate(f,false)}];}
    else{dels=fromStops('Unloading'); if(!dels.length)dels=noStops(t(f['Delivery Summary']),flatLoc(f,'Unloading',true),dd);}
  }catch(e){loads=[{name:'—',dt:ld}];dels=[{name:'—',dt:dd}];}
  loads.forEach(function(x){if(!x.dt)x.dt=ld;}); dels.forEach(function(x){if(!x.dt)x.dt=dd;});
  return {loads:loads,dels:dels};
}
// Sort key of a stop date: the day, then the time when there is one. A stop
// without a time (or with the 00:00/12:00 "unknown" sentinel, see hasTime)
// counts as the start of its day — the same plain string order _wiGrpOrder
// (weekly_intl.js) uses for its date fallback. A stop with no date at all goes
// last: placing it first would send the driver there before every dated stop.
function dtKey(s){
  if(!s)return '￿';
  s=String(s);
  return s.slice(0,10)+(hasTime(s)?' '+s.split('T')[1].slice(0,5):'');
}
// The route of a GROUP (owner 7/10): «φόρτωση 1, 2, 3 και μετά παραδόσεις
// 1, 2, 3 με τη σωστή σειρά όπως επιλέγει ο dispatcher». items arrive in the
// dispatcher's order (weekly_intl.js _wiGrpOrder: the Group ID suffix of the
// drag/Rota reorder, else the date). One order list cannot express both halves
// when they differ (IAB4166: 461 loads first, 463 delivers first), so the
// dispatcher's order decides the half it was set for — the pickups of an
// IMPORT group, the drops of an EXPORT group (same split as _wiGrpOrder's
// Loading/Delivery DateTime fallback) — and the other half follows the stops'
// own dates. Ties: dispatcher order, then the order's stop sequence. Inside an
// order its stops keep their sequence. Returns {loads, dels} of {e, oi, si}:
// e = the routeStops entry, oi = the order's index in items, si = its stop index.
// The ONLY ordering of a group: the WhatsApp text and the paper cover both read
// it, so the phone and the paper can never disagree on the sequence.
function groupRoute(items,isPartner,isExport){
  var loads=[],dels=[];
  items.forEach(function(it,oi){
    var f=it.orderRec.fields;
    var rs=routeStops(f,it.stops,isExport,!!f['Veroia Switch'],veroiaOf(f,isPartner));
    rs.loads.forEach(function(e,si){loads.push({e:e,oi:oi,si:si});});
    rs.dels.forEach(function(e,si){dels.push({e:e,oi:oi,si:si});});
  });
  function byDate(list){
    return list.slice().sort(function(a,b){
      var ka=dtKey(a.e.dt), kb=dtKey(b.e.dt);
      return ka<kb?-1:ka>kb?1:(a.oi-b.oi)||(a.si-b.si);
    });
  }
  return isExport?{loads:byDate(loads),dels:dels}:{loads:loads,dels:byDate(dels)};
}

var WA_EMO=['1️⃣','2️⃣','3️⃣','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟'];

function waNum(k){return WA_EMO[k]||('#'+(k+1));}

// The cargo of one order. withKeep: the «keep the CMR temperature» line sits

function waCargoLines(lines,f,isPartner,refNo,withKeep){
  var L=LBL;

// The office line and the closing line, then the text itself.
function waClose(lines){

  if(cb.length){lines.push('');lines.push('☎️ '+cb.join(' · '));}

  lines.push('');lines.push('ℹ️ '+L.waAuto);

// v2.1 (εγκεκριμένο): κείμενο WhatsApp ανά έγγραφο — GR οδηγός / EN partner.
// Τα *αστεράκια* γίνονται bold μέσα στο WhatsApp. A single order only: a group
// is ONE text built by waGroupBuild (owner 7/10).
function waBuild(f,isPartner,isExport,veroiaSwitch,VEROIA,VADDR,VLAT,VLNG,vehLine,orderNo,wk,refNo){
  var L=LBL;
  var rs=routeStops(f,orderStops,isExport,veroiaSwitch,{name:VEROIA,addr:VADDR,lat:VLAT,lng:VLNG});
  var lines=[];
  lines.push('🚛 *'+(isPartner?'ORDER':'ΕΝΤΟΛΗ')+' W'+wk+' · '+(isPartner?(isExport?'EXPORT':'IMPORT'):(isExport?'ΕΞΑΓΩΓΗ':'ΕΙΣΑΓΩΓΗ'))+' · '+orderNo+'*');
  if(vehLine)lines.push('👤 '+vehLine);

  rs.loads.forEach(function(x){waStopLines(lines,waNum(seq++),L.load,x);});
  rs.dels.forEach(function(x){waStopLines(lines,waNum(seq++),L.unload,x);});

// Owner 7/10 (IAB4166, orders 461 + 463): a group went out as one text per
// order joined by «————————» — the driver had to rebuild the route himself
// from two loading lists and two delivery lists. ONE text per group now: the
// header and the driver/vehicle once, every LOADING of the truck numbered
// 1..N, then every DELIVERY numbered 1..M, in groupRoute's order (the same
// order the paper cover prints), each stop tagged with its order; then one
// cargo block per order, the CMR line, ☎️ and the closing line once.
// Numbering restarts per section — the owner's own words («φόρτωση 1, 2, 3 και
// μετά παραδόσεις 1, 2, 3»): under its heading «παράδοση 2» is the second
// drop, the number the driver and the office say on the phone; a continuous
// 1..N+M would make the first drop «4» and the 10 emoji would run out sooner.
// The sheet language, week, driver/vehicle and direction come from the first
// order, as on the cover (one truck, one leg). _waArr then holds this one
// text, so copyWA, the share menu and the Worker's /print/pdf?format=text
// (window._waArr) all carry exactly it.
function waGroupBuild(items){
  var f0=items[0].orderRec.fields, isPartner=computeIsPartner(f0), isExport=leg==='export';
  LBL=isPartner?LBL_EN:LBL_GR;
  var L=LBL, route=groupRoute(items,isPartner,isExport);
  var nos=items.map(function(it){return ordNoOf(it.orderRec);});
  var lines=[];
  lines.push('🚛 *'+(isPartner?'ORDER':'ΕΝΤΟΛΗ')+' W'+(f0['Week Number']||'—')+' · '+(isPartner?(isExport?'EXPORT':'IMPORT'):(isExport?'ΕΞΑΓΩΓΗ':'ΕΙΣΑΓΩΓΗ'))+' · '+nos.join(' + ')+'*');
  var veh=vehLineOf(f0,isPartner);
  if(veh)lines.push('👤 '+veh);
  lines.push('');
  lines.push('*'+L.loadsSec+'*');
  route.loads.forEach(function(r,k){waStopLines(lines,waNum(k),L.load,r.e,'#'+nos[r.oi]);});
  lines.push('*'+L.delsSec+'*');
  route.dels.forEach(function(r,k){waStopLines(lines,waNum(k),L.unload,r.e,'#'+nos[r.oi]);});
  items.forEach(function(it,i){
    var f=it.orderRec.fields;
    lines.push('*'+L.cargoOf+' #'+nos[i]+'*');
    waCargoLines(lines,f,isPartner,f['Reference']||'',false);
    lines.push('');
  });

  return waClose(lines);
}

// The Veroia cross-dock stop of an order: {name, addr, lat, lng}. Shared by

function generatePDF(orderRec, bare){ // bare (Wave 3): no toolbar — docs 2..N of a group

  // the record-id fallback stays last-resort only. Typed by people when it

    var trailer=allTrailers.find(r=>f['Trailer']&&r.id===f['Trailer'][0])||{};
    var df=driver.fields||{},tf=truck.fields||{},trf=trailer.fields||{};
    var truckW=tf['Tare Weight kg']!=null?parseFloat(tf['Tare Weight kg']):null;
    var trailerW=trf['Tare Weight kg']!=null?parseFloat(trf['Tare Weight kg']):null;
    // Owner (9/8): μικτό = απόβαρο φορτηγού + απόβαρο τρέιλερ + μικτό φορτίου
    var haveGross=f['Gross Weight kg']!=null&&f['Gross Weight kg']!==''&&!isNaN(parseFloat(f['Gross Weight kg']));
    var cargoW=haveGross?parseFloat(f['Gross Weight kg']):0;
    // Σύνολο ΜΟΝΟ όταν ξέρουμε και τα τρία. 15/36 φορτηγά δεν έχουν απόβαρο
    // καταχωρημένο· εκεί τυπώνεται το φορτίο με ρητή ένδειξη τι λείπει, ώστε

    var tareKnown=(truckW!=null&&!isNaN(truckW))&&(trailerW!=null&&!isNaN(trailerW));

    var missTare=[];

    html=pbarHTML+

// Finding #6 (2026-09-08): a group print handed the driver N loose per-order
// documents with no combined view — the pickup/drop-off SEQUENCE across the
// whole load only became visible after reading every page. This builds ONE
// lead sheet FIRST, reusing the same blocks/functions as the per-order sheet
// (buildCard, the .vb/.route2/.cargo/.meta/.chk/.sigs2 markup), followed
// unchanged by the per-order documents (loadAll). items: [{orderRec, stops}].
function buildCoverDoc(items){
  var f0=items[0].orderRec.fields;
  var isPartner=computeIsPartner(f0);
  LBL=isPartner?LBL_EN:LBL_GR;
  var isExport=leg==='export';
  var legLabel=isExport?'Export':'Import', legLabelGr=isExport?'Εξαγωγή':'Εισαγωγή';
  var wk=f0['Week Number']||'—';

  // Owner 7/10 (IAB4166): the cover read «first loading of the FIRST order →
  // last unloading of the LAST order» and listed every order's stops in the
  // orderIds order — but that order is the dispatcher's order of ONE half of
  // the route only (_wiGrpOrder), so an import group whose first loader
  // delivers last printed the wrong destination and the wrong drop sequence.
  // groupRoute is the one ordering the WhatsApp text uses too (principle 3).
  var route=groupRoute(items,isPartner,isExport);
  var first=route.loads[0].e, last=route.dels[route.dels.length-1].e;
  var routeHTML='<div class="route2">'+
    '<div class="side"><div class="k">'+LBL.from+'</div><div class="n">'+escHtml(first.name)+'</div><div class="d">'+escHtml(fmtDT(first.dt))+'</div></div>'+
    '<div class="mid">→</div>'+
    '<div class="side to"><div class="k">'+LBL.to+'</div><div class="n">'+escHtml(last.name)+'</div><div class="d">'+escHtml(fmtDT(last.dt))+'</div></div>'+
  '</div>';

  // 4 cargo chips, totalled/merged across every order in the group.
  // Round 1 O10 (critic-4 C4-01): the cover is what the driver reads at each
  // stop, so its chips are built from EVERY member — the first order's pallet
  // type and «any PE = ΝΑΙ» told him to swap pallets at a warehouse whose piece
  // the base forbids to swap (Ε5) and to count EUR where it hands out CHEP.
  var totalPallets=0, peRefs=[], temps=[], anyCmr=false, goodsList=[], byType={}, typeOrder=[];
  items.forEach(function(it,i){
    var f=it.orderRec.fields;
    var p=parseFloat(fv(f['Total Pallets'])); if(!isNaN(p)) totalPallets+=p;
    var pt=fv(f['Pallet Type'])||'EUR';
    if(byType[pt]===undefined){byType[pt]=0;typeOrder.push(pt);}
    if(!isNaN(p)) byType[pt]+=p;
    if(f['Pallet Exchange']) peRefs.push(escHtml(String.fromCharCode(65+i)+' '+(f['Reference']||ordNoOf(it.orderRec))));
    // «Κατά CMR» (owner 7/10): such a member adds the CMR wording, never its number.
    if(tempPerCmr(f)) anyCmr=true;
    else if(f['Temperature °C']!==''&&f['Temperature °C']!=null&&temps.indexOf(String(f['Temperature °C']))<0) temps.push(String(f['Temperature °C']));
    if(fv(f['Goods'])&&goodsList.indexOf(fv(f['Goods']))<0) goodsList.push(fv(f['Goods']));
  });
  var anyPE=peRefs.length>0, allPE=peRefs.length===items.length;
  var palV=typeOrder.length>1
    ? typeOrder.map(function(t){return byType[t]+' <small>× '+escHtml(t)+'</small>';}).join(' + ')
    : (totalPallets||'—')+' <small>× '+escHtml(typeOrder[0]||'EUR')+'</small>';
  var peV=!anyPE?LBL.no:allPE?LBL.yes:LBL.yes+' <small>— '+(isPartner?'only ':'μόνο ')+peRefs.join(', ')+'</small>';
  var chipsHTML='<div class="cargo">'+
    '<div class="chip"><div class="k">'+LBL.pal+'</div><div class="v">'+palV+'</div></div>'+
    '<div class="chip '+(anyPE?'pe-yes':'pe-no')+'"><div class="k">'+LBL.pe+'</div><div class="v">'+peV+'</div></div>'+
    '<div class="chip temp"><div class="k">'+LBL.temp+'</div><div class="v'+(anyCmr?' cmr':'')+'">'+([temps.length?escHtml(temps.join(' / '))+'°C':'',anyCmr?escHtml(LBL.tempCmr):''].filter(Boolean).join(' / ')||'—')+'</div></div>'+
    '<div class="chip"><div class="k">'+LBL.goods+'</div><div class="v" style="font-size:11.5px">'+(goodsList.length?escHtml(goodsList.join(' · ')):'—')+'</div></div>'+
  '</div>'+keepCmrHTML();

  // Vehicle bar: the group shares one truck/trailer/driver once assigned
  // (a merged Weekly International row) — read from the first order.
  var driver=allDrivers.find(function(r){return f0['Driver']&&r.id===f0['Driver'][0];})||{};
  var truck=allTrucks.find(function(r){return f0['Truck']&&r.id===f0['Truck'][0];})||{};
  var trailer=allTrailers.find(function(r){return f0['Trailer']&&r.id===f0['Trailer'][0];})||{};
  var df=driver.fields||{}, tf=truck.fields||{}, trf=trailer.fields||{};
  var vbHTML=isPartner?'':'<div class="vb">'+
    '<div class="c"><div class="k">Οδηγός</div><div class="v">'+escHtml(df['Full Name']||'—')+'</div></div>'+
    '<div class="c"><div class="k">Φορτηγό</div><div class="v">'+escHtml(tf['License Plate']||'—')+'</div></div>'+
    '<div class="c"><div class="k">Τρέιλερ</div><div class="v">'+escHtml(trf['License Plate']||'—')+'</div></div>'+
  '</div>';

  // The order's last ORDER STOPS delivery — the name its stop tag and the
  // delivery sequence below identify it by.
  // C4-11 (round 3): an unresolved location prints «—», never «undefined».
  function lastNameOf(it){
    var uns=stopsOfType(it.stops,'Unloading'), lastUn=uns[uns.length-1];
    return (lastUn&&(resolveLoc(lastUn.fields['Location'])||{}).name)||'—';
  }
  // Meta grid: every order number/reference in the group + delivery sequence:
  // the orders in the order their first drop comes in groupRoute — the
  // dispatcher's order only where it decides the drops (an export group).
  var orderNos=items.map(function(it){return ordNoOf(it.orderRec);});
  var seqIdx=[];
  route.dels.forEach(function(r){if(seqIdx.indexOf(r.oi)<0)seqIdx.push(r.oi);});
  var seqNames=seqIdx.map(function(i){
    return String.fromCharCode(65+i)+'. '+escHtml(lastNameOf(items[i]));
  });
  var _m=isPartner
    ?{wk:'Week',cat:'Category',ord:'Order Nos',seq:'Delivery Sequence'}
    :{wk:'Εβδομάδα',cat:'Κατηγορία',ord:'Αρ. Εντολών',seq:'ΣΕΙΡΑ ΠΑΡΑΔΟΣΗΣ'};
  var metaHTML='<div class="meta">'+
    '<div class="meta-item"><span class="meta-lbl">'+_m.wk+'</span><span class="meta-val">W'+escHtml(wk)+'</span></div>'+
    '<div class="meta-item"><span class="meta-lbl">'+_m.cat+'</span><span class="meta-val">'+(isPartner?legLabel:legLabelGr)+'</span></div>'+
    '<div class="meta-item"><span class="meta-lbl">'+_m.ord+'</span><span class="meta-val">'+escHtml(orderNos.join(' · '))+'</span></div>'+
    '<div class="meta-item"><span class="meta-lbl">'+_m.seq+'</span><span class="meta-val">'+seqNames.join(' → ')+'</span></div>'+
  '</div>';

  // Each card tagged with its own order.
  // C4-02: the piece is marked as stock on the cover too, at its stop.
  // C4-03 (round 3): on its OWN line at 10px — the hand-over identity (lot +
  // client) was the smallest text on the page the driver reads there.
  var tags=items.map(function(it,i){
    var stk=stockLotText(it.orderRec.fields,isPartner);
    return 'ΠΑΡΑΓΓΕΛΙΑ '+String.fromCharCode(65+i)+' · '+escHtml(ordNoOf(it.orderRec))+' · '+escHtml(lastNameOf(it))+(stk?'<span class="stk">'+(isPartner?'From stock · ':'Απόθεμα · ')+escHtml(stk)+'</span>':'');
  });
  // Timeline: groupRoute's loadings, then its deliveries, each under its own
  // heading and numbered from 1 (buildCard increments _stopSeq) — the same
  // numbers the WhatsApp text gives the same stops (owner 7/10).
  function cardsOf(list,dtLabel){
    var h='';
    _stopSeq=0;
    list.forEach(function(r){
      var e=r.e, f=items[r.oi].orderRec.fields, lc=e.loc||{};
      h+=buildCard(0,{name:e.name,address:e.addr,lat:e.lat||'',lng:e.lng||'',hours:lc.hours||'',days:lc.days||''},
        dtLabel,e.dt,e.sf?(e.sf['Pallets']||''):fv(f['Total Pallets']),
        fv(f['Pallet Type']),false,'','','','','',tags[r.oi]);
    });
    return h;
  }
  var tlHTML='<div class="section-title load-section">'+LBL.loadsSec+'</div><div class="tl">'+cardsOf(route.loads,'loading')+'</div>'+
    '<div class="section-title unload-section">'+LBL.delsSec+'</div><div class="tl">'+cardsOf(route.dels,'delivery')+'</div>';

  var chkHTML=isPartner?'':'<div class="chk"><b>'+LBL.chk+'</b>'+
    '<span>☐ Θερμογράφος σε λειτουργία</span><span>☐ Τρέιλερ καθαρό / προψυγμένο</span>'+
    '<span>☐ Παλέτες μετρημένες</span><span>☐ CMR υπογεγραμμένο</span></div>';
  var contactBits=[];
  if(OFFICE_PHONE)contactBits.push('<span><b>'+LBL.office+':</b> '+escHtml(OFFICE_PHONE)+'</span>');
  if(EMERGENCY_PHONE)contactBits.push('<span><b>'+LBL.emrg+':</b> '+escHtml(EMERGENCY_PHONE)+'</span>');
  if(OFFICE_EMAIL)contactBits.push('<span><b>Email:</b> '+escHtml(OFFICE_EMAIL)+'</span>');
  if(INVOICE_EMAIL)contactBits.push('<span><b>Invoicing:</b> '+escHtml(INVOICE_EMAIL)+'</span>');
  var contactHTML=contactBits.length?'<div class="contact2">'+contactBits.join('')+'</div>':'';
  var sigsHTML='<div class="sigs2">'+
    '<div class="s"><div class="who">VERMION FRESH SA / PETRAS GROUP</div><div class="role">Dispatcher</div><div class="line">Υπογραφή &amp; Ημερομηνία</div></div>'+
    '<div class="s"><div class="who">'+escHtml(df['Full Name']||'—')+'</div><div class="role">Οδηγός · Παραλαβή εντολής</div><div class="line">Υπογραφή &amp; Ημερομηνία</div></div>'+
  '</div>';

  var titleStr=(isPartner?'Partner Assignment Order — Group':'Εντολή Οδηγού · Ομάδα')+' — '+legLabel+' — W'+wk;
  window._shTitle=titleStr;
  var pbarHTML='<div class="pbar"><div class="pbar-left">'+
    '<span class="pbar-logo">PETRAS<span> GROUP</span></span>'+
    '<div class="pbar-div"></div>'+
    '<span class="pbar-title">'+escHtml(titleStr)+'</span>'+
    '</div><div><button class="pbar-btn wa" onclick="copyWA(this)">📋 WhatsApp</button><button class="pbar-btn" onclick="window.print()">Print / PDF</button></div></div>'+
    '<div class="pbar-spacer"></div>';
  var hdHTML='<div class="doc-header">'+
    '<div class="brand-wrap" style="text-align:left">'+
      '<div class="brand">PETRAS<span> GROUP</span></div>'+
      '<div class="brand-sub">International Road Transport Services</div>'+
      '<div class="co-info" style="text-align:left"><b>VERMION FRESH SA</b><br>Kopanos, Naousa — Imathia<br>vermionfresh@petrasgroup.com</div>'+
    '</div>'+
    '<div class="doctag">'+
      '<div class="k">'+(isPartner?'Group Order':'Εντολή Οδηγού · Ομάδα')+'</div>'+
      '<div class="t">W'+escHtml(wk)+' · '+(isPartner?legLabel:legLabelGr)+'</div>'+
      '<div class="s">'+LBL.issued+' '+new Date().toLocaleDateString('el-GR')+' '+new Date().toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'})+' · '+DISPATCHER+'</div>'+
    '</div>'+
  '</div>';

  return pbarHTML+hdHTML+vbHTML+routeHTML+chipsHTML+metaHTML+tlHTML+chkHTML+contactHTML+sigsHTML;
}

// Wave 3 (Π1): assemble one or many documents. Group mode: page-break between
// docs + «ΕΓΓΡΑΦΟ i/N» tag, so the driver/partner gets ONE paper packet.
function renderDocs(htmlArr){
  document.getElementById('loading').style.display='none';
  var docEl=document.getElementById('doc');
  docEl.style.display='block';
  var N=htmlArr.length;
  // Κανόνας 7: η αποτυχία μιλάει και ξεχωρίζει από το κενό. Χωρίς τον πίνακα
  // τοποθεσιών κάθε διεύθυνση γίνεται «—» και το φύλλο έβγαινε σιωπηλά σωστό.
  if (window.__locsFailed) {
    docEl.insertAdjacentHTML('beforebegin',
      '<div style="background:#FEE2E2;border:2px solid #B91C1C;color:#7F1D1D;padding:12px 14px;margin:0 0 12px;font:700 13px system-ui;border-radius:6px">'
      + '⚠ ΟΙ ΤΟΠΟΘΕΣΙΕΣ ΔΕΝ ΦΟΡΤΩΘΗΚΑΝ — οι διευθύνσεις παρακάτω λείπουν επειδή απέτυχε η ανάγνωση, ΟΧΙ επειδή δεν υπάρχουν. ΜΗΝ δώσεις αυτό το φύλλο στον οδηγό. Κάνε ανανέωση.'
      + '</div>');
  }
  if (window.__clientsFailed) {
    docEl.insertAdjacentHTML('beforebegin',
      '<div id="clientsFailed" style="background:#FEE2E2;border:2px solid #B91C1C;color:#7F1D1D;padding:12px 14px;margin:0 0 12px;font:700 13px system-ui;border-radius:6px">'
      + '⚠ ΤΟ ΟΝΟΜΑ ΠΕΛΑΤΗ ΤΟΥ ΚΟΜΜΑΤΙΟΥ ΔΕΝ ΔΙΑΒΑΣΤΗΚΕ — το «—» παρακάτω είναι αποτυχία ανάγνωσης. ΜΗΝ δώσεις αυτό το φύλλο στον οδηγό. Κάνε ανανέωση.'
      + '</div>');
  }
  if (window.__waGroupFailed) {
    docEl.insertAdjacentHTML('beforebegin',
      '<div id="waGroupFailed" style="background:#FEF3C7;border:2px solid #B45309;color:#78350F;padding:12px 14px;margin:0 0 12px;font:700 13px system-ui;border-radius:6px">'
      + '⚠ ΤΟ ΕΝΙΑΙΟ ΚΕΙΜΕΝΟ WHATSAPP ΤΗΣ ΟΜΑΔΑΣ ΔΕΝ ΦΤΙΑΧΤΗΚΕ — το 📋 WhatsApp δίνει ένα κείμενο ανά παραγγελία, ΧΩΡΙΣ τη σειρά της διαδρομής. Τη σειρά των στάσεων τη δείχνει το εξώφυλλο. Ενημέρωσε το γραφείο.'
      + '</div>');
  }
  docEl.innerHTML=htmlArr.map(function(h,i){
    var tag=N>1?'<div style="font-size:9px;font-weight:800;letter-spacing:1.2px;color:#6B7280;margin:0 0 8px">ΟΜΑΔΙΚΟ ΦΟΡΤΙΟ — ΕΓΓΡΑΦΟ '+(i+1)+' / '+N+'</div>':'';
    return '<div class="p-doc" style="'+(i<N-1?'page-break-after:always;':'')+'">'+tag+h+'</div>';
  }).join('');
  // Μενού κοινής χρήσης (owner 25/8): δεξί κλικ / long-press στο κουμπί
  // εκτύπωσης. Αριστερό κλικ = window.print(), όπως πάντα. Το payload
  // κειμένου είναι το ΙΔΙΟ _waArr του copyWA — όχι δεύτερη εκδοχή (αρχή 3).
  var shBtn=document.querySelector('.pbar-btn:not(.wa)');
  if(shBtn&&window.attachShareMenu){
    attachShareMenu(shBtn,{
      title:window._shTitle||'PETRAS GROUP',
      fileName:window._shTitle||'petras-doc',
      getText:function(){return _waArr.join('\n\n————————\n\n');},
      // Το PDF ΕΙΝΑΙ αυτή η σελίδα: ο Worker την αποδίδει με τα ΙΔΙΑ params.
      pdfUrl:function(){return PROXY_URL+'/print/pdf'+location.search;},
      onPrint:function(){window.print();}
    });
  }
  // &noprint=1: άνοιγμα για προεπισκόπηση/έλεγχο χωρίς διάλογο εκτύπωσης
  // (π.χ. λογιστήριο που απλώς διαβάζει, ή αυτοματοποιημένος έλεγχος).
  if(params.get('noprint')!=='1') setTimeout(()=>window.print(),700);
}

loadAll();
</script>
