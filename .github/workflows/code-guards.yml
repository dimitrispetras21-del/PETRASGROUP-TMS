# Static code guards, no secrets and no network.
#
# This is the ONLY workflow in the repo, and that is deliberate. It was created
# separate from the old e2e-smoke.yml because that workflow was gated on an
# unset secret and failed on every run, so a check added there would never have
# executed. e2e-smoke.yml was then removed entirely (2026-08-02) once it turned
# out to be obsolete post-cutover, and the split proved its worth: these guards
# ran green throughout.
#
# Keep it dependency-free. The value here is that it CANNOT be blocked by a
# missing secret, an expired token, or a backend being down: a checkout is all
# it needs (plan-no-resend and f5-tests add Node itself, nothing from npm). Anything
# requiring credentials belongs in its own workflow, so its failures never
# mask these.
#
# Runtime is a couple of seconds; there is no reason for it not to run on
# every PR.

name: Code guards

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fail-open:
    name: No new silent-failure fallbacks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ratchet check: the number of data fetches that swallow their error into
      # an empty default may fall, never rise. This pattern caused four
      # production incidents in the week of 2026-07-29; see the script header
      # and core/utils.js safeFetch().
      - name: Check fail-open data fetches
        run: bash tests/check-fail-open.sh

  plan-no-resend:
    name: /plan/* writes are never sent twice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Two-sided pin (review of PR #90, findings 1 and 8): the Worker answers a
      # /plan/* write whose outcome is unknown with a status core/api.js
      # _atRetry never sends again (plan-routes reads core/api.js), the real
      # _atRetry is run against it (one fetch), and no client _atRetry call may
      # send a /plan/* request at all. A later change to _atRetry or to the
      # Worker's statuses would otherwise reopen it without a word. Node only,
      # no npm install: both files use node:test and the source as it is.
      - name: Run the /plan/* no-resend pins
        run: node --test tests/api-plan-no-resend.test.mjs worker/test/plan-routes.test.mjs

  f5-tests:
    name: National v5 F5 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The F5 (day L) tests of the front end, one line per file as each stream's
      # PR lands; stream (e) of the F5 plan owns this list (plan §10). Why here:
      # the review of PR #117 found tests/plan-config.test.mjs ran on no machine
      # but the author's, so a later change to core/plan-config.js could read a
      # failed GET /plan/config as 'before' again without a red check. Node only,
      # no npm install, like plan-no-resend above.
      - name: Run the F5 tests
        run: node --test tests/plan-config.test.mjs
