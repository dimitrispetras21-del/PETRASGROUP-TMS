<figcaption><b>Σχήμα 1 — Οι πίνακες και τα δεσίματά τους.</b> Το <b>ct_round_trips</b> είναι το κέντρο κόστους: δένει με τον στόλο (trucks/drivers/partners) και, μέσω των <b>ct_rt_legs</b>, με τα υπάρχοντα orders / national_loads — τα έσοδα διαβάζονται πάντα με JOIN από το price, ποτέ δεν αντιγράφονται. Οι γραμμές κόστους (<b>ct_cost_lines</b>, καθαρό+ΦΠΑ χωριστά) φτάνουν στο σωστό trip με το μπλε βέλος: πινακίδα + ημερομηνία μέσα στο παράθυρο του trip. Δεξιά, τα views υπολογίζουν φθορά, έσοδα (με το VS ±X), κόστη και το owner-only PnL με τα δύο margins — κανένα νούμερο δεν αποθηκεύεται. Οι υπάρχοντες πίνακες ΔΕΝ τροποποιούνται.</figcaption>
